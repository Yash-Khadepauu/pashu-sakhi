              <option value="Low">{t ? t("screen_low") : "Low"}</option>
              <option value="Very low">{t ? t("screen_veryLow") : "Very low"}</option>
              <option value="Not moving">{t ? t("screen_notMoving") : "Not moving"}</option>
            </select>
          </div>

          <label className="field-label">{t ? t("screen_notesLabel") : "Anything else you noticed (optional)"}</label>
          <textarea
            className="field-input"
            rows={3}
            style={{ marginBottom: 20, resize: "vertical" }}
            placeholder={t ? t("screen_notesPlaceholder") : "E.g. started yesterday evening, after grazing near the pond..."}
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
          />

          <button className="btn-primary" style={{ width: "100%" }} onClick={submit}>{t ? t("screen_submit") : "Submit for screening"}</button>
        </Card>
      ) : (
        <div>
          <Card className={`result-card result-${result.level === "urgent" ? "urgent" : result.level === "attention" ? "attention" : "healthy"}`}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
              <span className="badge" style={{ fontSize: "calc(12px * var(--text-scale, 1))", fontWeight: 800, textTransform: "uppercase", letterSpacing: "0.5px", padding: "4px 9px", borderRadius: 6, background: "rgba(0,0,0,0.08)", color: "var(--ink)" }}>
                {t ? t("screen_resultBadge") : "AI-assisted screening result"}
              </span>
              <span style={{ fontSize: "calc(13.5px * var(--text-scale, 1))", fontWeight: 700, color: "var(--ink-soft)" }}>
                {animalName}
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              {result.level === "urgent" && <AlertTriangle size={22} color="var(--urgent-fg, var(--urgent))" />}
              {result.level === "attention" && <AlertCircle size={22} color="var(--attention-fg, var(--attention))" />}
              {result.level === "healthy" && <CheckCircle2 size={22} color="var(--healthy-fg, var(--healthy))" />}
              <p style={{ margin: 0, fontWeight: 700, fontSize: "calc(18px * var(--text-scale, 1))" }}>
                {(t && t("screen_title_" + result.level)) || result.title}
              </p>
            </div>
            <p style={{ margin: "0 0 12px", lineHeight: 1.6 }}>
              {(t && (result.factors.length === 0 ? t("screen_expl_none") : t("screen_expl_" + result.level))) || result.explanation}
            </p>
            <p style={{ margin: 0, fontWeight: 700, lineHeight: 1.6 }}>
              {(t && t("screen_rec_" + result.level)) || result.recommendation}
            </p>
          </Card>

          <div
            className="screening-disclaimer-card"
            style={{
              display: "flex",
              alignItems: "flex-start",
              gap: 10,
              background: "var(--paper-soft)",
              border: "1.5px solid var(--line)",
              borderRadius: 10,
              padding: "13px 15px",
              margin: "14px 0 20px",
            }}
          >
            <Info size={19} color="var(--brand)" style={{ flexShrink: 0, marginTop: 1 }} />
            <p style={{ margin: 0, fontSize: "calc(13px * var(--text-scale, 1))", lineHeight: 1.55, color: "var(--ink)", fontWeight: 600 }}>
              {t ? t("screen_resultDisclaimer") : "AI-assisted screening result. This is not a confirmed medical diagnosis. Final assessment must be made by a qualified veterinarian."}
            </p>
          </div>

          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", width: "100%" }}>
            <button className="btn-outline" onClick={reset} style={{ flex: "1 1 auto" }}>{t ? t("screen_screenAnother") : "Screen another"}</button>
            <button className="btn-primary" onClick={() => onDiscussWithVet && onDiscussWithVet(animalId, animalName)} style={{ flex: "1 1 auto" }}><MessageCircle size={16} /> {t ? t("screen_discussWithVet") : "Discuss with vet"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* AI Disease Detection view                                           */
/* ------------------------------------------------------------------ */
function DiseaseDetectionView({ animals, preselectedId, setSelectedAnimalId, onBack, onDiscussWithVet, t }) {
  const [animalId, setAnimalId] = useState(preselectedId || animals[0]?.id);
  const [selectedImage, setSelectedImage] = useState(null);
  const [imageMeta, setImageMeta] = useState(null);
  const [error, setError] = useState(null);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [result, setResult] = useState(null);

  const cameraInputRef = useRef(null);
  const uploadInputRef = useRef(null);

  useEffect(() => {
    if (preselectedId) setAnimalId(preselectedId);
  }, [preselectedId]);

  const handleAnimalChange = (id) => {
    setAnimalId(id);
    if (setSelectedAnimalId) setSelectedAnimalId(id);
  };

  const currentAnimal = animals.find((a) => a.id === animalId) || animals[0];
  const animalName = currentAnimal?.name || "Animal";

  const handleBack = () => {
    if (result) {
      setResult(null);
    } else if (selectedImage) {
      setSelectedImage(null);
      setImageMeta(null);
      setError(null);
    } else {
      onBack();
    }
  };

  const validateAndLoadFile = (file) => {
    setError(null);
    if (!file) return;

    // Reject unsupported formats
    const isImage = file.type.startsWith("image/") || /\.(jpe?g|png|webp|bmp|gif)$/i.test(file.name);
    if (!isImage) {
      setError(t ? t("disease_errUnsupported") : "Unsupported file format. Please select an image file (e.g., JPG, PNG, WebP).");
      return;
    }

    // Reject files > 10MB
    const maxSizeBytes = 10 * 1024 * 1024;
    if (file.size > maxSizeBytes) {
      setError(t ? t("disease_errTooLarge") : "Image file exceeds 10MB limit. Please choose a smaller photo.");
      return;
    }

    // Read file via FileReader
    const reader = new FileReader();
    reader.onload = (e) => {
      setSelectedImage(e.target.result);
      const sizeStr = file.size > 1024 * 1024 
        ? `${(file.size / (1024 * 1024)).toFixed(1)} MB` 
        : `${Math.round(file.size / 1024)} KB`;
      setImageMeta({ name: file.name, size: sizeStr });
      setError(null);
    };
    reader.onerror = () => {
      setError(t ? t("disease_errReadFailed") : "Unable to read the image file. Please try another photo.");
    };
    reader.readAsDataURL(file);
  };

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    validateAndLoadFile(file);
    // Reset file input so user can choose same file again if desired
    e.target.value = "";
  };

  const removePhoto = () => {
    setSelectedImage(null);
    setImageMeta(null);
    setError(null);
  };

  const runAnalysis = () => {
    if (!selectedImage) {
      setError(t ? t("disease_errNoImage") : "Please select or capture an image before starting analysis.");
      return;
    }

    setError(null);
    setIsAnalyzing(true);

    window.setTimeout(() => {
      setIsAnalyzing(false);

      // Deterministic realistic simulated result based on animal ID
      let generated;
      if (animalId === "a1") {
        // Gauri: Suspected dermatitis
        generated = {
          level: "attention",
          possibleCondition: "Suspected Bovine Dermatitis / Cutaneous Lesions",
          confidence: 87,
          indicators: [
            "Circular crusted lesions along epidermal surface",
            "Focal hair thinning (alopecia) around neck/shoulder crease",
            "Localized erythema (redness) without deep ulcerative tissue"
          ],
          nextSteps: [
            "Isolate animal from common milking stall to prevent potential contact spread",
            "Avoid scratching or peeling crusts with bare hands",
            "Keep stall floor clean, dry, and free of wet bedding or biting insects",
            "Consult Dr. Kavita Rao to confirm diagnosis and prescribe topical ointment"
          ]
        };
      } else if (animalId === "a2") {
        // Raju: Suspected nodular lesions (urgent attention)
        generated = {
          level: "urgent",
          possibleCondition: "Suspected Nodular Skin Lesions (Lumpy Skin Disease Profile)",
          confidence: 91,
          indicators: [
            "Multiple distinct raised nodules (2-5 cm) across cutaneous layer",
            "Superficial necrotic center observed on primary neck nodule",
            "Localized edema and marked epidermal sensitivity in the affected region"
          ],
          nextSteps: [
            "Immediately isolate Raju from all other herd members in a separate shed",
            "Implement strict fly, mosquito, and tick control measures around the shelter",
            "Contact your on-call veterinarian immediately for confirmatory clinical testing",
            "Monitor rectal temperature twice daily and ensure clean drinking water"
          ]
        };
      } else if (animalId === "a3") {
        // Lakshmi: Minor abrasion
        generated = {
          level: "attention",
          possibleCondition: "Localized Surface Abrasion & Mild Folliculitis",
          confidence: 84,
          indicators: [
            "Superficial epidermal scraping likely from friction or stall fencing",
            "Minor focal swelling with no purulent discharge or deep tissue involvement",
            "Surrounding skin tissue and hair follicles show mild irritation"
          ],
          nextSteps: [
            "Clean the affected area gently with clean warm water or mild antiseptic wash",
            "Inspect stall walls and fences for protruding wires or sharp rough edges",
            "Apply veterinary antiseptic spray if advised by health worker",
            "Observe for any spreading or heat over the next 48 hours"
          ]
        };
      } else {
        // Moti or default: Clean / Low risk
        generated = {
          level: "healthy",
          possibleCondition: "No Critical Visible Pathological Lesions Detected",
          confidence: 93,
          indicators: [
            "Skin surface appears intact without circular lesions or crusts",
            "Uniform coat texture without marked focal alopecia or patches",
            "No acute cutaneous swelling, discharge, or open sores detected"
          ],
          nextSteps: [
            "Continue routine daily grooming, clean feeding, and observation",
            "Ensure scheduled bi-monthly preventive vaccinations remain up to date",
            "Re-screen if the animal shows behavioral distress, fever, or skin irritation"
          ]
        };
      }

      setResult(generated);
      if (window.PashuSakhiBridge) {
        const sess = window.PashuSakhiBridge.getSession();
        window.PashuSakhiBridge.addReport({
          type: 'detection',
          animalId,
          animalName: animalName || 'Livestock',
          farmerName: (sess && sess.name) || profile.name || "Suresh Patil",
          date: new Date().toISOString().split('T')[0],
          condition: generated.possibleCondition || "AI Image Screening",
          severity: generated.level || "attention",
          confidence: generated.confidence || 89,
          status: "New",
          details: generated
        });
      }
    }, 1350);
  };

  const resetToImageSelection = () => {
    setResult(null);
    setSelectedImage(null);
    setImageMeta(null);
    setError(null);
  };

  return (
    <div>
      {/* Page Header */}
      <div className="page-header">
        <button className="back-btn" onClick={handleBack} aria-label={t ? t("common_back") : "Back"}>
          <ArrowLeft size={18} />
        </button>
        <div>
          <h1 className="page-title">{t ? t("disease_title") : "AI Disease Detection"}</h1>
          <p style={{ margin: "2px 0 0", fontSize: "calc(13px * var(--text-scale, 1))", color: "var(--ink-soft)" }}>
            {t ? t("disease_subtitle") : "Upload or capture a photo of your animal to analyze for visible health concerns."}
          </p>
        </div>
      </div>

      {/* Top Disclaimer Card */}
      <Card style={{ marginBottom: 16, display: "flex", gap: 10, alignItems: "flex-start", background: "var(--brand-soft)" }}>
        <Info size={18} color="var(--brand-ink, var(--brand-dark))" style={{ flexShrink: 0, marginTop: 2 }} />
        <p style={{ margin: 0, fontSize: "calc(13px * var(--text-scale, 1))", color: "var(--brand-ink, var(--brand-dark))", lineHeight: 1.5, fontWeight: 600 }}>
          {t ? t("disease_disclaimer_top") : "AI-assisted image screening. This result is not a confirmed diagnosis. Image-based results can be inaccurate. A qualified veterinarian must examine the animal and confirm any condition."}
        </p>
      </Card>

      {/* Hidden File Inputs */}
      <input
        type="file"
        ref={cameraInputRef}
        accept="image/*"
        capture="environment"
        style={{ display: "none" }}
        onChange={handleFileChange}
        aria-label="Take animal photo with camera"
      />
      <input
        type="file"
        ref={uploadInputRef}
        accept="image/*"
        style={{ display: "none" }}
        onChange={handleFileChange}
        aria-label="Upload animal image from device"
      />

      {/* MAIN CONTENT STATES */}
      {!result ? (
        <div>
          <Card style={{ marginBottom: 16 }}>
            {/* Animal Selector */}
            <label className="field-label" htmlFor="dd-animal-select">
              {t ? t("disease_selectAnimal") : "Select animal"}
            </label>
            <select
              id="dd-animal-select"
              className="field-input"
              style={{ marginBottom: 18 }}
              value={animalId}
              onChange={(e) => handleAnimalChange(e.target.value)}
              disabled={isAnalyzing}
            >
              {animals.map((a) => (
                <option key={a.id} value={a.id}>
                  {a.name}  —  {formatSpecies(a.species, t)}
                </option>
              ))}
            </select>

            {/* Error Message if any */}
            {error && (
              <div
                role="alert"
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  padding: "11px 14px",
                  background: "var(--urgent-soft)",
                  border: "1.5px solid var(--urgent)",
                  borderRadius: 10,
                  marginBottom: 16,
                  color: "var(--urgent)",
                  fontWeight: 600,
                  fontSize: "calc(13.5px * var(--text-scale, 1))"
                }}
              >
                <AlertTriangle size={18} style={{ flexShrink: 0 }} />
                <span>{error}</span>
              </div>
            )}

            {/* Photo Selection / Preview Area */}
            {!selectedImage ? (
              <div>
                <label className="field-label">
                  {t ? t("disease_previewTitle") : "Animal Photo"}
                </label>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
                  {/* Option 1: Take Photo */}
                  <button
                    type="button"
                    className="dd-input-card"
                    onClick={() => cameraInputRef.current?.click()}
                    aria-label={t ? t("disease_takePhoto") : "Take Photo"}
                  >
                    <div style={{ width: 48, height: 48, borderRadius: 12, background: "var(--brand-soft)", color: "var(--brand-ink, var(--brand-dark))", display: "flex", alignItems: "center", justifyItems: "center", justifyContent: "center" }}>
                      <Camera size={24} />
                    </div>
                    <span style={{ fontWeight: 700, fontSize: "calc(15px * var(--text-scale, 1))" }}>
                      {t ? t("disease_takePhoto") : "Take Photo"}
                    </span>
                    <span style={{ fontSize: "calc(12px * var(--text-scale, 1))", color: "var(--ink-soft)", lineHeight: 1.3 }}>
                      {t ? t("disease_takePhotoSub") : "Use device camera to photograph animal"}
                    </span>
                  </button>

                  {/* Option 2: Upload Image */}
                  <button
                    type="button"
                    className="dd-input-card"
                    onClick={() => uploadInputRef.current?.click()}
                    aria-label={t ? t("disease_uploadImage") : "Upload Image"}
                  >
                    <div style={{ width: 48, height: 48, borderRadius: 12, background: "var(--accent-soft)", color: "#874D00", display: "flex", alignItems: "center", justifyItems: "center", justifyContent: "center" }}>
                      <ScanSearch size={24} />
                    </div>
                    <span style={{ fontWeight: 700, fontSize: "calc(15px * var(--text-scale, 1))" }}>
                      {t ? t("disease_uploadImage") : "Upload Image"}
                    </span>
                    <span style={{ fontSize: "calc(12px * var(--text-scale, 1))", color: "var(--ink-soft)", lineHeight: 1.3 }}>
                      {t ? t("disease_uploadImageSub") : "Select image from your device (JPG, PNG, WebP)"}
                    </span>
                  </button>
                </div>

                {/* Helpful Guidelines */}
                <div style={{ background: "var(--paper-soft)", border: "1px solid var(--line)", borderRadius: 10, padding: "12px 14px" }}>
                  <p style={{ margin: 0, fontSize: "calc(12.5px * var(--text-scale, 1))", color: "var(--ink-soft)", lineHeight: 1.5 }}>
                    <strong>{t ? t("disease_photoGuidelines") : "Tips: ensure clear daylight lighting, hold the camera steady, and focus directly on the affected skin or body area."}</strong>
                  </p>
                </div>
              </div>
            ) : (
              <div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
                  <label className="field-label" style={{ margin: 0 }}>
                    {t ? t("disease_previewTitle") : "Selected Photo Preview"}
                  </label>
                  {imageMeta && (
                    <span style={{ fontSize: "calc(12px * var(--text-scale, 1))", color: "var(--ink-soft)", fontWeight: 600 }}>
                      {imageMeta.name} ({imageMeta.size})
                    </span>
                  )}
                </div>

                {/* Preview Box with optional scanning animation */}
                <div className="dd-preview-box" style={{ marginBottom: 14 }}>
                  <img
                    src={selectedImage}
                    alt={`Selected preview for ${animalName}`}
                    className="dd-preview-img"
                  />
                  {isAnalyzing && (
                    <div className="dd-laser-line" />
                  )}
                </div>

                {/* Analyzing Loader Card */}
                {isAnalyzing ? (
                  <div
                    style={{
                      background: "var(--brand-soft)",
                      border: "1.5px solid var(--brand)",
                      borderRadius: 12,
                      padding: "16px 18px",
                      textAlign: "center",
                      marginBottom: 16
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 8 }}>
                      <Activity size={22} className="spin-anim" color="var(--brand)" />
                      <strong style={{ fontSize: "calc(16px * var(--text-scale, 1))", color: "var(--brand-ink, var(--brand-dark))" }}>
                        {t ? t("disease_analysingTitle") : "Analyzing visible features..."}
                      </strong>
                    </div>
                    <p style={{ margin: "0 0 10px", fontSize: "calc(13px * var(--text-scale, 1))", color: "var(--ink-soft)" }}>
                      {t ? t("disease_analysingSub") : "Examining skin, coat texture, lesions, and visible signs."}
                    </p>
                    <div style={{ background: "rgba(0,0,0,0.08)", height: 6, borderRadius: 999, overflow: "hidden", marginBottom: 10 }}>
                      <div style={{ width: "85%", height: "100%", background: "var(--brand)", borderRadius: 999, transition: "width 1.2s ease" }} />
                    </div>
                    <span style={{ display: "inline-block", fontSize: "calc(11.5px * var(--text-scale, 1))", background: "#FFF3CD", color: "#856404", padding: "4px 10px", borderRadius: 6, fontWeight: 700 }}>
                      {t ? t("disease_analysingSimNote") : "Prototype Demonstration: Simulating local computer vision feature extraction... No live cloud model is queried."}
                    </span>
                  </div>
                ) : (
                  <div>
                    {/* Controls before analysis */}
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                      <button
                        type="button"
                        className="btn-outline"
                        style={{ flex: "1 1 120px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                        onClick={() => cameraInputRef.current?.click()}
                      >
                        <Camera size={15} /> {t ? t("disease_retakePhoto") : "Retake photo"}
                      </button>
                      <button
                        type="button"
                        className="btn-outline"
                        style={{ flex: "1 1 120px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                        onClick={() => uploadInputRef.current?.click()}
                      >
                        <ScanSearch size={15} /> {t ? t("disease_selectAnother") : "Select another"}
                      </button>
                      <button
                        type="button"
                        className="btn-outline"
                        style={{ color: "var(--urgent)", borderColor: "var(--urgent-soft)", minWidth: 44 }}
                        onClick={removePhoto}
                        aria-label={t ? t("disease_removePhoto") : "Remove photo"}
                      >
                        <Trash2 size={16} />
                      </button>
                    </div>

                    {/* Primary CTA */}
                    <button
                      type="button"
                      className="btn-primary"
                      style={{ width: "100%", minHeight: 48, fontSize: "calc(15.5px * var(--text-scale, 1))" }}
                      onClick={runAnalysis}
                    >
                      <ScanSearch size={18} /> {t ? t("disease_analyseBtn") : "Analyze Animal Photo"}
                    </button>
                  </div>
                )}
              </div>
            )}
          </Card>
        </div>
      ) : (
        /* RESULT VIEW */
        <div>
          <Card className={`result-card result-${result.level === "urgent" ? "urgent" : result.level === "attention" ? "attention" : "healthy"}`}>
            {/* Header with badge and animal name */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
              <span className="badge" style={{ fontSize: "calc(12px * var(--text-scale, 1))", fontWeight: 800, textTransform: "uppercase", letterSpacing: "0.5px", padding: "4px 9px", borderRadius: 6, background: "rgba(0,0,0,0.08)", color: "var(--ink)" }}>
                {t ? t("disease_resultBadge") : "AI Disease Detection Result"}
              </span>
              <span style={{ fontSize: "calc(13.5px * var(--text-scale, 1))", fontWeight: 700, color: "var(--ink-soft)" }}>
                {animalName}
              </span>
            </div>

            {/* Cautious Headline */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
              {result.level === "urgent" && <AlertTriangle size={24} color="var(--urgent-fg, var(--urgent))" />}
              {result.level === "attention" && <AlertCircle size={24} color="var(--attention-fg, var(--attention))" />}
              {result.level === "healthy" && <CheckCircle2 size={24} color="var(--healthy-fg, var(--healthy))" />}
              <h2 style={{ margin: 0, fontWeight: 700, fontSize: "calc(19px * var(--text-scale, 1))", color: "var(--ink)" }}>
                {result.level !== "healthy" 
                  ? (t ? t("disease_possibleConcernDetected") : "Possible concern detected")
                  : (t ? t("disease_noVisibleConcerns") : "No obvious visual concerns detected")}
              </h2>
            </div>

            {/* Uploaded image thumbnail + condition grid */}
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", background: "rgba(255,255,255,0.55)", padding: 12, borderRadius: 12, marginBottom: 16 }}>
              {selectedImage && (
                <div style={{ width: 88, height: 88, borderRadius: 10, overflow: "hidden", border: "1.5px solid var(--line)", flexShrink: 0, background: "#000" }}>
                  <img
                    src={selectedImage}
                    alt={`Analyzed photo of ${animalName}`}
                    style={{ width: "100%", height: "100%", objectFit: "cover" }}
                  />
                </div>

              <div style={{ flex: "1 1 200px" }}>
                <div style={{ fontSize: "calc(12px * var(--text-scale, 1))", fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 2 }}>
                  {t ? t("disease_possibleCondition") : "Possible Condition"}
                </div>
                <div style={{ fontSize: "calc(16px * var(--text-scale, 1))", fontWeight: 800, color: "var(--ink)", marginBottom: 6 }}>
                  {result.possibleCondition}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  {/* Severity Badge */}
                  <span
                    style={{
                      fontSize: "calc(11.5px * var(--text-scale, 1))",
                      fontWeight: 800,
                      padding: "3px 8px",
                      borderRadius: 6,
                      background: result.level === "urgent" ? "var(--urgent)" : result.level === "attention" ? "var(--attention)" : "var(--healthy)",
                      color: "#fff"
                    }}
                  >
                    {result.level === "urgent"
                      ? (t ? t("disease_severity_urgent") : "Urgent Attention")
                      : result.level === "attention"
                      ? (t ? t("disease_severity_attention") : "Needs Attention")
                      : (t ? t("disease_severity_low") : "Low Risk")}
                  </span>

                  {/* Confidence */}
                  <span style={{ fontSize: "calc(12.5px * var(--text-scale, 1))", color: "var(--ink-soft)", fontWeight: 700 }}>
                    {t ? t("disease_confidence") : "Confidence"}: {result.confidence}%
                  </span>
                </div>
              </div>
            </div>

            {/* Visible Indicators */}
            <div style={{ marginBottom: 14 }}>
              <strong style={{ display: "block", fontSize: "calc(13.5px * var(--text-scale, 1))", marginBottom: 6, color: "var(--ink)" }}>
                {t ? t("disease_visibleIndicators") : "Visible Indicators Identified"}:
              </strong>
              <div>
                {result.indicators.map((ind, idx) => (
                  <div key={idx} className="dd-indicator-item">
                    <span style={{ color: "var(--brand)", fontWeight: 800 }}>•</span>
                    <span>{ind}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Recommended Next Steps */}
            <div style={{ marginBottom: 14 }}>
              <strong style={{ display: "block", fontSize: "calc(13.5px * var(--text-scale, 1))", marginBottom: 6, color: "var(--ink)" }}>
                {t ? t("disease_recommendedNextStep") : "Recommended Next Steps"}:
              </strong>
              <div>
                {result.nextSteps.map((step, idx) => (
                  <div key={idx} className="dd-indicator-item">
                    <span style={{ color: "var(--accent)", fontWeight: 800 }}>✓</span>
                    <span>{step}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Cautious Notice */}
            <div style={{ fontSize: "calc(12px * var(--text-scale, 1))", color: "var(--ink-soft)", fontStyle: "italic", borderTop: "1px solid rgba(0,0,0,0.1)", paddingTop: 8 }}>
              {t ? t("disease_cautiousNotice") : "Notice: Cautious screening indication only. Does not replace physical veterinary evaluation."}
            </div>
          </Card>

          {/* Prominent Medical Disclaimer */}
          <div
            className="screening-disclaimer-card"
            style={{
              display: "flex",
              alignItems: "flex-start",
              gap: 12,
              background: "var(--paper-soft)",
              border: "1.5px solid var(--line)",
              borderRadius: 12,
              padding: "14px 16px",
              margin: "14px 0 20px",
            }}
          >
            <ShieldCheck size={22} color="var(--brand)" style={{ flexShrink: 0, marginTop: 1 }} />
            <p style={{ margin: 0, fontSize: "calc(13px * var(--text-scale, 1))", lineHeight: 1.55, color: "var(--ink)", fontWeight: 700 }}>
              {t ? t("disease_disclaimer") : "AI-assisted image screening. This result is not a confirmed diagnosis. Image-based results can be inaccurate. A qualified veterinarian must examine the animal and confirm any condition."}
            </p>
          </div>

          {/* Action Buttons */}
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", width: "100%" }}>
            <button
              type="button"
              className="btn-outline"
              onClick={resetToImageSelection}
              style={{ flex: "1 1 180px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 7 }}
            >
              <Camera size={16} /> {t ? t("disease_analyseAnother") : "Analyse Another Image"}
            </button>
            <button
              type="button"
              className="btn-primary"
              onClick={() => onDiscussWithVet && onDiscussWithVet(animalId, animalName)}
              style={{ flex: "1 1 180px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 7 }}
            >
              <MessageCircle size={16} /> {t ? t("disease_discussWithVet") : "Discuss with Vet"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ChatView({ animals, selectedAnimalId, setSelectedAnimalId, chats, onSend, onBack, t }) {
  const animalId = selectedAnimalId || animals[0]?.id;
  const animal = animals.find((a) => a.id === animalId);
  const chat = chats[animalId] || { messages: [], typing: false };
  const [text, setText] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [chat.messages.length, chat.typing]);

  const quickActions = [
    { id: "symptoms", label: t ? t("chat_qa_symptoms_label") : "Share symptoms", text: `${animal?.name} ${t ? t("chat_qa_symptoms_text") : "isn't behaving normally, I'd like to describe the symptoms."}` },
    { id: "treatment", label: t ? t("chat_qa_treatment_label") : "Ask about treatment", text: t ? t("chat_qa_treatment_text") : `Can you tell me more about ${animal?.name}'s current treatment?` },
    { id: "vaccination", label: t ? t("chat_qa_vaccination_label") : "Ask about vaccination", text: t ? t("chat_qa_vaccination_text") : `When is ${animal?.name}'s next vaccination due?` },
    { id: "consultation", label: t ? t("chat_qa_consultation_label") : "Request a consultation", text: t ? t("chat_qa_consultation_text") : `Could we schedule a vet consultation for ${animal?.name}?` },
  ];

  const handleSend = (msgText, category) => {
    onSend(animalId, msgText, category);
    setText("");
  };

  return (
    <div>
      <div className="page-header">
        <button className="back-btn" onClick={onBack} aria-label={t ? t("common_back") : "Back"}><ArrowLeft size={18} /></button>
        <h1 className="page-title">{t ? t("nav_chatWithVet") : "Chat with Vet"}</h1>
      </div>

      <div style={{ marginBottom: 14 }}>
        <label className="field-label">{t ? t("chat_talkingAbout") : "Talking about"}</label>
        <select className="field-input" style={{ width: "100%", maxWidth: 360 }} value={animalId} onChange={(e) => setSelectedAnimalId(e.target.value)}>
          {animals.map((a) => (
            <option key={a.id} value={a.id}>
              {a.name}  —  {formatSpecies(a.species, t)}
            </option>
          ))}
        </select>
      </div>

      <div className="chat-window">
        <div className="chat-messages" ref={scrollRef}>
          <div className="bubble vet">
            {t ? t("chat_welcome") : `Namaste! I'm Dr. Kavita Rao. How can I help with ${animal?.name} today?`}
            <div className="bubble-time">{t ? t("chat_vetName") : "Dr. Kavita Rao"}</div>
          </div>
          {chat.messages.map((m) => (
            <div key={m.id} className={`bubble ${m.sender}`}>
              {m.text}
              <div className="bubble-time">
                {m.sender === "vet" ? (t ? t("chat_vetName") : "Dr. Kavita Rao") : (t ? t("chat_you") : "You")}    {m.time === "Just now" && t ? t("time_justNow") : m.time}
              </div>
            </div>
          ))}
          {chat.typing && (
            <div className="bubble vet" style={{ color: "var(--ink-soft)" }}>
              {t ? t("chat_vetTyping") : "Dr. Kavita Rao is typing..."}
            </div>
          )}
        </div>
        <div className="quick-actions">
          {quickActions.map((q) => (
            <button key={q.id} className="chip" onClick={() => handleSend(q.text, q.id)}>{q.label}</button>
          ))}
        </div>
        <div className="chat-input-row">
          <input
            className="field-input"
            aria-label={t ? t("chat_inputPlaceholder") : "Type your message..."}
            placeholder={t ? t("chat_inputPlaceholder") : "Type your message..."}
            value={text}
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && text.trim()) handleSend(text, "symptoms"); }}
          />
          <button className="btn-primary" onClick={() => text.trim() && handleSend(text, "symptoms")} aria-label={t ? t("common_send") : "Send"}><Send size={16} /></button>
        </div>
      </div>
    </div>
  );
}

function getLocalizedNotif(n, t) {
  if (!t) return n;
  const isEn = t("notif_n1_title") === en["notif_n1_title"];
  if (n.id === "n1") {
    return {
      ...n,
      title: isEn ? `${t("notif_n1_title")} Gauri` : `Gauri ${t("notif_n1_title")}`,
      message: `FMD vaccination ${t("dash_due").toLowerCase()} ${relativeDay("2026-09-12", t)} (${formatDate("2026-09-12")}).`,
      time: `${t("time_today")}, 8:00 AM`,
    };
  }
  if (n.id === "n2") {
    return {
      ...n,
      title: isEn ? `Raju's ${t("notif_n2_title")}` : `Raju ${t("notif_n2_title")}`,
      message: `${t("dash_followUp")} ${relativeDay("2026-09-05", t)}.`,
      time: `${t("time_today")}, 7:30 AM`,
    };
  }
  if (n.id === "n3") {
    return {
      ...n,
      title: t("notif_n3_title"),
      message: t("notif_n3_msg"),
      time: t("time_yesterday"),
    };
  }
  if (n.id === "n4") {
    return {
      ...n,
      title: isEn ? `${t("notif_n4_title")} Lakshmi` : `Lakshmi ${t("notif_n4_title")}`,
      message: t("notif_n4_msg"),
      time: `2 ${t("time_daysAgo")}`,
    };
  }
  if (n.id === "n5") {
    return {
      ...n,
      title: `${t("notif_n5_title")} Moti`,
      message: t("notif_n5_msg"),
      time: `2 ${t("time_daysAgo")}`,
    };
  }
  if (n.id === "n6") {
    return {
      ...n,
      title: `${t("notif_n6_title")} Gauri`,
      message: t("notif_n6_msg"),
      time: `3 ${t("time_daysAgo")}`,
    };
  }
  return n;
}

function NotificationsView({ notifications, onOpen, onBack, t }) {
  const catMap = {
    vaccination: { Icon: Syringe, bg: "var(--accent-soft)", color: "var(--accent)" },
    treatment: { Icon: Stethoscope, bg: "var(--attention-soft)", color: "var(--attention-fg, var(--attention))" },
    screening: { Icon: Activity, bg: "var(--brand-soft)", color: "var(--brand-fg, var(--brand))" },
    consultation: { Icon: MessageCircle, bg: "var(--healthy-soft)", color: "var(--healthy-fg, var(--healthy))" },
    checkup: { Icon: ClipboardList, bg: "var(--brand-soft)", color: "var(--brand-fg, var(--brand))" },
    general: { Icon: Bell, bg: "var(--paper-soft)", color: "var(--ink-soft)" },
  };
  const sorted = [...notifications].sort((a, b) => (a.read === b.read ? 0 : a.read ? 1 : -1));
  return (
    <div>
      <div className="page-header">
        <button className="back-btn" onClick={onBack} aria-label={t ? t("common_back") : "Back"}><ArrowLeft size={18} /></button>
        <h1 className="page-title">{t ? t("nav_notifications") : "Notifications"}</h1>
      </div>
      <Card>
        {sorted.length === 0 ? (
          <div style={{ textAlign: "center", padding: "36px 16px", color: "var(--ink-soft)" }}>
            <Bell size={32} style={{ opacity: 0.35, marginBottom: 10 }} />
            <p style={{ margin: 0, fontWeight: 600, fontSize: "calc(14.5px * var(--text-scale, 1))" }}>
              {t ? t("notif_empty") : "No notifications right now."}
            </p>
          </div>
        ) : (
          sorted.map((n, i) => {
            const locN = getLocalizedNotif(n, t);
            const c = catMap[n.category] || catMap.general || { Icon: Bell, bg: "var(--paper-soft)", color: "var(--ink-soft)" };
            const { Icon } = c;
            return (
              <div
                key={n.id}
                className={`notif-item psk-card-clickable ${n.read ? "read" : "unread"}`}
                style={{ cursor: "pointer", borderBottom: i === sorted.length - 1 ? "none" : undefined }}
                onClick={() => onOpen(n)}
                role="button"
                tabIndex={0}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(n); } }}
              >
                {!n.read && <div className="notif-dot" />}
                {n.read && <div style={{ width: 9 }} />}
                <div className="notif-icon" style={{ background: c.bg }}><Icon size={17} color={c.color} /></div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ margin: "0 0 3px", fontWeight: n.read ? 600 : 800, fontSize: "calc(14.5px * var(--text-scale, 1))" }}>{locN.title}</p>
                  <p style={{ margin: "0 0 4px", fontSize: "calc(13.5px * var(--text-scale, 1))", color: "var(--ink-soft)" }}>{locN.message}</p>
                  <p style={{ margin: 0, fontSize: "calc(11.5px * var(--text-scale, 1))", color: "var(--ink-soft)" }}>{locN.time}</p>
                </div>
                <ChevronRight size={17} color="var(--ink-soft)" />
              </div>
            );
          })
        )}
      </Card>
    </div>
  );
}
/* ------------------------------------------------------------------ */
/* Profile view                                                        */
/* ------------------------------------------------------------------ */
function ProfileView({ profile, setProfile, animalCount, onSaved, onBack, t }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(profile);
  useEffect(() => { setDraft(profile); }, [profile]);

  const [error, setError] = useState("");
  const startEdit = () => { setDraft(profile); setError(""); setEditing(true); };
  const save = () => {
    if (!draft.name || !draft.name.trim()) {
      setError(t ? t("profile_nameRequired") : "Farmer name cannot be empty.");
      return;
    }
    setError("");
    setProfile(draft);
    setEditing(false);
    onSaved && onSaved();
  };
  const cancel = () => { setDraft(profile); setError(""); setEditing(false); };

  return (
    <div>
      <div className="page-header">
        <button className="back-btn" onClick={onBack} aria-label={t ? t("common_back") : "Back"}><ArrowLeft size={18} /></button>
        <h1 className="page-title">{t ? t("nav_profile") : "Profile"}</h1>
      </div>
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 20, flexWrap: "wrap" }}>
          <div style={{ width: 64, height: 64, borderRadius: "50%", background: "var(--brand)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 600, flexShrink: 0 }}>
            {profile.name.slice(0, 1)}
          </div>
          <div style={{ flex: "1 1 140px", minWidth: 0 }}>
            <p style={{ margin: "0 0 2px", fontWeight: 700, fontSize: "calc(18px * var(--text-scale, 1))", overflowWrap: "break-word", wordBreak: "break-word" }}>{profile.name}</p>
            <p style={{ margin: 0, fontSize: "calc(13.5px * var(--text-scale, 1))", color: "var(--ink-soft)" }}>{animalCount} {t ? t("profile_registeredAnimals") : "registered animals"}</p>
            <div style={{ marginTop: 5 }}>
              <span className="badge badge-neutral" style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: "calc(12px * var(--text-scale, 1))" }}>
                <Info size={12} /> {t ? t("profile_demoNotice") : "Demo profile  Local prototype data"}
              </span>
            </div>
          </div>
          {!editing && <button className="btn-outline" onClick={startEdit} style={{ flexShrink: 0 }}><Edit3 size={14} style={{ verticalAlign: -2 }} /> {t ? t("profile_edit") : "Edit"}</button>}
        </div>

        <div style={{ display: "grid", gap: 16 }}>
          <ProfileField label={t ? t("profile_farmerName") : "Farmer name"} icon={User} value={draft.name} editing={editing} onChange={(v) => setDraft({ ...draft, name: v })} />
          <ProfileField label={t ? t("profile_mobileNumber") : "Mobile number"} icon={Phone} value={draft.mobile} editing={editing} onChange={(v) => setDraft({ ...draft, mobile: v })} />
          <ProfileField label={t ? t("profile_villageLocation") : "Village / location"} icon={MapPin} value={draft.village} editing={editing} onChange={(v) => setDraft({ ...draft, village: v })} />
          <ProfileField label={t ? t("profile_numberOfAnimals") : "Number of animals"} icon={PawPrint} value={String(animalCount)} editing={false} onChange={() => {}} />
          <ProfileField label={t ? t("profile_registeredOn") : "Registered on"} icon={Calendar} value={formatDate(profile.registered)} editing={false} onChange={() => {}} />
        </div>

        {editing && (
          <>
            {error && (
              <div role="alert" style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", background: "var(--urgent-soft)", borderRadius: 8, border: "1px solid var(--urgent)", marginTop: 14 }}>
                <AlertCircle size={16} color="var(--urgent-fg, var(--urgent))" style={{ flexShrink: 0 }} />
                <p style={{ color: "var(--urgent-fg, var(--urgent))", fontSize: "calc(13px * var(--text-scale, 1))", margin: 0, fontWeight: 600 }}>{error}</p>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap", width: "100%" }}>
              <button className="btn-primary" onClick={save} style={{ flex: "1 1 auto" }}><Save size={15} /> {t ? t("common_save") : "Save changes"}</button>
              <button className="btn-outline" onClick={cancel} style={{ flex: "1 1 auto" }}><X size={15} style={{ verticalAlign: -2 }} /> {t ? t("common_cancel") : "Cancel"}</button>
            </div>
          </>
        )}
      </Card>
    </div>
  );
}

function ProfileField({ label, icon: Icon, value, editing, onChange }) {
  return (
    <div>
      <label className="field-label"><Icon size={13} style={{ verticalAlign: -2 }} /> {label}</label>
      {editing ? (
        <input className="field-input" aria-label={label} value={value} onChange={(e) => onChange(e.target.value)} />
      ) : (
        <p style={{ margin: 0, fontSize: "calc(15px * var(--text-scale, 1))", fontWeight: 600 }}>{value}</p>
      )}
    </div>
  );
}

function ChangePasswordModal({ t, onClose, showToast }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  const submit = () => {
    if (!current.trim() || !next.trim() || !confirm.trim()) {
      setError(t("pwd_required"));
      setSuccess(false);
      return;
    }
    if (next.length < 8) {
      setError(t("pwd_tooShort"));
      setSuccess(false);
      return;
    }
    if (next !== confirm) {
      setError(t("pwd_mismatch"));
      setSuccess(false);
      return;
    }
    setError("");
    setSuccess(true);
    showToast && showToast(t("pwd_success"));
  };

  return (
    <SettingsModal title={t("settings_changePassword")} icon={Lock} onClose={onClose} labelledId="password-modal-title">
      {success ? (
        <div style={{ display: "grid", gap: 14 }}>
          <div role="status" style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "12px", background: "var(--healthy-soft)", borderRadius: 10, border: "1px solid var(--healthy)" }}>
            <CheckCircle2 size={18} color="var(--healthy-fg, var(--healthy))" style={{ flexShrink: 0, marginTop: 2 }} />
            <p style={{ margin: 0, color: "var(--healthy-fg, var(--healthy))", fontSize: "calc(13.5px * var(--text-scale, 1))", lineHeight: 1.5, fontWeight: 600 }}>
              {t("pwd_success")}
            </p>
          </div>
          <button className="btn-outline" onClick={onClose} style={{ alignSelf: "flex-start" }}>{t("common_close")}</button>
        </div>
      ) : (
        <div style={{ display: "grid", gap: 14 }}>
          <div>
            <label className="field-label" htmlFor="pwd-current">{t("pwd_current")}</label>
            <input id="pwd-current" type="password" className="field-input" value={current} onChange={(e) => { setCurrent(e.target.value); setError(""); }} />

          <div>

function PermissionsModal({ t, onClose }) {
  const [statuses, setStatuses] = useState({
    camera: "unsupported",
    microphone: "unsupported",
    location: "unsupported",
    notifications: "unsupported",
  });

  useEffect(() => {
    let cancelled = false;

    async function checkPermissions() {
      const next = {
        camera: "unsupported",
        microphone: "unsupported",
        location: "unsupported",
        notifications: "unsupported",
      };

      // 1. Browser Notifications API check (without triggering permission requests)
      if (typeof window !== "undefined" && "Notification" in window) {
        const p = Notification.permission;
        next.notifications = p === "default" ? "prompt" : p;
      }

      // 2. Query Permissions API if supported by the browser
      if (typeof navigator !== "undefined" && navigator.permissions && typeof navigator.permissions.query === "function") {
        // Geolocation
        try {
          const res = await navigator.permissions.query({ name: "geolocation" });
          if (res && res.state) next.location = res.state;
          if (res && typeof res.addEventListener === "function") {
            res.addEventListener("change", () => {
              if (!cancelled) setStatuses((prev) => ({ ...prev, location: res.state }));
            });
          }
        } catch {
          if ("geolocation" in navigator) next.location = "prompt";
        }

        // Camera
        try {
          const res = await navigator.permissions.query({ name: "camera" });
          if (res && res.state) next.camera = res.state;
          if (res && typeof res.addEventListener === "function") {
            res.addEventListener("change", () => {
              if (!cancelled) setStatuses((prev) => ({ ...prev, camera: res.state }));
            });
          }
        } catch {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            next.camera = "prompt";
          }
        }

        // Microphone
        try {
          const res = await navigator.permissions.query({ name: "microphone" });
          if (res && res.state) next.microphone = res.state;
          if (res && typeof res.addEventListener === "function") {
            res.addEventListener("change", () => {
              if (!cancelled) setStatuses((prev) => ({ ...prev, microphone: res.state }));
            });
          }
        } catch {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            next.microphone = "prompt";
          }
        }

        // Notifications
        try {
          const res = await navigator.permissions.query({ name: "notifications" });
          if (res && res.state) {
            next.notifications = res.state;
            if (typeof res.addEventListener === "function") {
              res.addEventListener("change", () => {
                if (!cancelled) setStatuses((prev) => ({ ...prev, notifications: res.state }));
              });
            }
          }
        } catch {}
      } else {
        if ("geolocation" in navigator) next.location = "prompt";
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          next.camera = "prompt";
          next.microphone = "prompt";
        }
      }

      if (!cancelled) setStatuses(next);
    }

    checkPermissions();
    return () => { cancelled = true; };
  }, []);

  const labelFor = (s) => ({
    granted: t("perm_granted"),
    denied: t("perm_denied"),
    prompt: t("perm_prompt"),
    unsupported: t("perm_unsupported"),
  }[s] || t("perm_unsupported"));

  const badgeClassFor = (s) => {
    switch (s) {
      case "granted": return "badge-healthy";
      case "denied": return "badge-urgent";
      case "prompt": return "badge-attention";
      default: return "badge-neutral";
    }
  };

  const rows = [
    { key: "camera", label: t("perm_camera"), desc: t("perm_cameraDesc") || "Used for capturing animal photos during AI screening", Icon: Camera },
    { key: "notifications", label: t("perm_notifications"), desc: t("perm_notificationsDesc") || "Browser alerts for upcoming vaccinations and treatments", Icon: Bell },
    { key: "location", label: t("perm_location"), desc: t("perm_locationDesc") || "Used for finding nearby veterinary help in emergencies", Icon: Navigation },
    { key: "microphone", label: t("perm_microphone"), desc: t("perm_microphoneDesc") || "Used for voice symptom input and notes", Icon: Mic },
  ];

  return (
    <SettingsModal title={t("settings_appPermissions")} icon={ShieldCheck} onClose={onClose} labelledId="permissions-modal-title">
      <div style={{ display: "grid", gap: 4 }}>
        {rows.map((r) => (
          <div key={r.key} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: "1px solid var(--line)" }}>
            <div className="settings-row-icon"><r.Icon size={17} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ margin: "0 0 2px", fontWeight: 700, fontSize: "calc(14px * var(--text-scale, 1))" }}>{r.label}</p>
              <p style={{ margin: 0, color: "var(--ink-soft)", fontSize: "calc(12px * var(--text-scale, 1))", lineHeight: 1.4 }}>{r.desc}</p>
            </div>
            <span className={`badge ${badgeClassFor(statuses[r.key])}`} style={{ flexShrink: 0 }}>
              {labelFor(statuses[r.key])}
            </span>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 14, padding: "10px 12px", background: "var(--paper-soft)", borderRadius: 10, border: "1px solid var(--line)" }}>
        <p style={{ color: "var(--ink-soft)", fontSize: "calc(12px * var(--text-scale, 1))", margin: 0, lineHeight: 1.6 }}>
          <Info size={13} style={{ verticalAlign: -2, marginRight: 5, color: "var(--brand)" }} />
          {t("perm_manageNote")}
        </p>
      </div>
    </SettingsModal>
  );
}

    const previouslyFocused = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const timer = setTimeout(() => closeBtnRef.current?.focus(), 0);
    const handleKeyDown = (e) => {
      if (e.key === "Escape") { e.preventDefault(); onClose(); return; }

    document.addEventListener("keydown", handleKeyDown);
    return () => {
      clearTimeout(timer);
      document.body.style.overflow = prevOverflow;
      document.removeEventListener("keydown", handleKeyDown);

                {getT("ivr_opt_3", "3. Report Animal Mortality")}
              </button>
              <button className="btn-secondary" style={{ justifyContent: "flex-start", textAlign: "left" }} onClick={() => handleOption(getT("ivr_opt_4", "4. General Government Assistance"))}>
                {getT("ivr_opt_4", "4. General Government Assistance")}
              </button>
            </div>
          </>
        )}

        {step === 1 && (
          <div style={{ padding: "10px 0" }}>
            <div style={{ background: "var(--healthy-soft)", color: "var(--healthy)", padding: "12px", borderRadius: "8px", marginBottom: "16px", display: "flex", alignItems: "center", gap: "8px" }}>
              <CheckCircle size={18} />
              <span style={{ fontWeight: "600" }}>{getT("ivr_req_registered", "Your request has been registered.")}</span>
            </div>
            
            <div style={{ background: "var(--paper-soft)", border: "1px solid var(--line)", padding: "16px", borderRadius: "8px", marginBottom: "20px" }}>
              <div style={{ marginBottom: "10px" }}>
                <span style={{ fontSize: "12px", color: "var(--ink-soft)", display: "block", textTransform: "uppercase", letterSpacing: "0.5px" }}>{getT("ivr_assist_type", "Assistance Type")}</span>
                <span style={{ fontWeight: "500" }}>{selectedOpt}</span>
              </div>
              <div style={{ marginBottom: "10px" }}>
                <span style={{ fontSize: "12px", color: "var(--ink-soft)", display: "block", textTransform: "uppercase", letterSpacing: "0.5px" }}>{getT("ivr_ref_id", "Reference ID")}</span>
                <span style={{ fontWeight: "500", fontFamily: "monospace" }}>REQ-{Math.floor(1000 + Math.random() * 9000)}</span>
              </div>
              <div>
                <span style={{ fontSize: "12px", color: "var(--ink-soft)", display: "block", textTransform: "uppercase", letterSpacing: "0.5px" }}>{getT("ivr_est_status", "Connection Status")}</span>
                <span style={{ fontWeight: "500", color: "var(--attention)" }}>{getT("ivr_ready", "Ready to Connect")}</span>
              </div>
            </div>

            <button className="btn-primary" style={{ width: "100%", justifyContent: "center", padding: "12px", fontSize: "15px" }} onClick={handleConnect}>
              <Phone size={18} style={{ marginRight: "8px" }} />
              {getT("nav_emergencyGuide", "Connect to Admin")}
            </button>
          </div>
        )}

        {step === 2 && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <Loader size={36} className="spinning" style={{ color: "var(--brand)", marginBottom: 16 }} />
            <p style={{ margin: 0, fontSize: "17px", fontWeight: "600" }}>{getT("ivr_connecting", "Connecting you to Admin...")}</p>
            <p style={{ color: "var(--ink-soft)", margin: "8px 0 0" }}>{getT("ivr_please_wait", "Please wait...")}</p>
          </div>
        )}

        {step === 3 && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <Phone size={44} color="var(--healthy)" style={{ marginBottom: 16 }} />
            <p style={{ margin: 0, fontSize: "18px", fontWeight: "600", color: "var(--healthy)" }}>{getT("ivr_connected", "Connected to Admin")}</p>
            <p style={{ color: "var(--ink-soft)", margin: "12px 0 28px", lineHeight: "1.5" }}>{getT("ivr_admin_rep", "An Admin representative is now available to assist you.")}</p>
            <button className="btn-secondary" style={{ width: "100%", justifyContent: "center" }} onClick={onClose}>
              {getT("auto_close", "Close / Done")}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<PashuSakhiDashboard />);
</script>
<script>
  window.addEventListener("error", function (event) {
    const root = document.getElementById("root");
    if (root && root.innerHTML.trim() === "") {
      root.innerHTML = '<div style="font-family:Arial,sans-serif;padding:40px;max-width:700px;margin:auto"><h2>PashuSakhi could not start</h2><p>Please open this file in Chrome/Edge with an internet connection. React, Babel, and Lucide are loaded from CDN.</p><p style="color:#b3402a">' + (event.message || 'Unknown loading error') + '</p></div>';
    }
  });
</script>
</body>
</html>
