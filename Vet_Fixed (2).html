<script>
(function() {
  const _tabId = 'tab_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
  const _listeners = new Set();

  function _get(key, defaultVal) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : defaultVal;
    } catch (e) {
      return defaultVal;
    }
  }

  function _set(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      console.warn('PashuSakhiBridge storage write failed:', e);
    }
  }

  function broadcast(event, data) {
    const payload = { event, data, timestamp: Date.now(), sourceId: _tabId };
    try {
      localStorage.setItem('psk_bridge_event', JSON.stringify(payload));
    } catch (e) {}
    _listeners.forEach(fn => {
      try { fn(event, data); } catch (err) { console.error('PashuSakhiBridge listener error:', err); }
    });
  }

  window.addEventListener('storage', function(e) {
    if (e.key === 'psk_bridge_event' && e.newValue) {
      try {
        const payload = JSON.parse(e.newValue);
        if (payload && payload.sourceId !== _tabId) {
          _listeners.forEach(fn => {
            try { fn(payload.event, payload.data); } catch (err) { console.error('PashuSakhiBridge cross-tab listener error:', err); }
          });
        }
      } catch (err) {}
    }
  });

  window.PashuSakhiBridge = {
    tabId: _tabId,

    setSession: function(sessionObj) {
      _set('psk_session', sessionObj);
      if (sessionObj && sessionObj.language) {
        try {
          localStorage.setItem('psk_language', sessionObj.language);
          localStorage.setItem('lumen_selected_language', sessionObj.language);
        } catch (e) {}
      }
      broadcast('psk:session:updated', sessionObj);
    },

    getSession: function() {
      return _get('psk_session', null);
    },

    clearSession: function() {
      try {
        localStorage.removeItem('psk_session');
        localStorage.removeItem('session:current');
        localStorage.removeItem('pashusakhi_user');
      } catch (e) {}
      broadcast('psk:session:cleared', {});
    },

    getReports: function(filter) {
      const all = _get('psk_shared_reports', []);
      if (!filter || filter === 'All') return all;
      return all.filter(r => (r.status || '').toLowerCase() === filter.toLowerCase());
    },

    addReport: function(report) {
      const reports = _get('psk_shared_reports', []);
      const newRep = {
        id: report.id || ('rep_' + Date.now()),
        type: report.type || 'screening',
        animalId: report.animalId || 'a1',
        animalName: report.animalName || 'Livestock',
        farmerName: report.farmerName || 'Suresh Patil',
        date: report.date || new Date().toISOString().split('T')[0],
        condition: report.condition || 'Suspected condition',
        severity: report.severity || 'attention',
        confidence: report.confidence || 85,
        status: report.status || 'New',
        details: report.details || {}
      };
      reports.unshift(newRep);
      _set('psk_shared_reports', reports);
      broadcast('psk:report:added', newRep);
      return newRep;
    },

    updateReportStatus: function(id, status) {
      const reports = _get('psk_shared_reports', []);
      let updated = null;
      const next = reports.map(r => {
        if (r.id === id) {
          updated = { ...r, status };
          return updated;
        }
        return r;
      });
      _set('psk_shared_reports', next);
      if (updated) broadcast('psk:report:updated', updated);
      return updated;
    },

    getEmergencies: function(filter) {
      const all = _get('psk_shared_emergencies', []);
      if (!filter || filter === 'All') return all;
      return all.filter(e => (e.status || '').toLowerCase() === filter.toLowerCase());
    },

    addEmergency: function(emergency) {
      const emergencies = _get('psk_shared_emergencies', []);
      const newEmg = {
        id: emergency.id || ('emg_' + Date.now()),
        animalId: emergency.animalId || 'a1',
        animalName: emergency.animalName || 'Livestock',
        farmerName: emergency.farmerName || 'Suresh Patil',
        village: emergency.village || 'Wagholi, Pune',
        contact: emergency.contact || '+91 98765 43210',
        severity: emergency.severity || 'critical',
        status: emergency.status || 'new',
        title: emergency.title || 'Emergency Case',
        time: emergency.time || 'Just now',
        assignedVet: emergency.assignedVet || null
      };
      emergencies.unshift(newEmg);
      _set('psk_shared_emergencies', emergencies);
      broadcast('psk:emergency:added', newEmg);
      return newEmg;
    },

    updateEmergencyStatus: function(id, status, vetName) {
      const emergencies = _get('psk_shared_emergencies', []);
      let updated = null;
      const next = emergencies.map(e => {
        if (e.id === id) {
          updated = {
            ...e,
            status,
            assignedVet: vetName || e.assignedVet || 'Dr. Kavita Rao'
          };
          return updated;
        }
        return e;
      });
      _set('psk_shared_emergencies', next);
      if (updated) broadcast('psk:emergency:updated', updated);
      return updated;
    },

    getChats: function(animalId) {
      const chats = _get('psk_shared_chats', {});
      return animalId ? (chats[animalId] || []) : chats;
    },

    sendChat: function(animalId, msg) {
      const chats = _get('psk_shared_chats', {});
      if (!chats[animalId]) chats[animalId] = [];
      const newMsg = {
        id: msg.id || ('msg_' + Date.now()),
        sender: msg.sender || 'farmer',
        text: msg.text || '',
        time: msg.time || 'Just now',
        timestamp: Date.now(),
        animalId: animalId
      };
      chats[animalId].push(newMsg);
      _set('psk_shared_chats', chats);
      broadcast('psk:chat:message', { animalId, message: newMsg });
      return newMsg;
    },

    getAnimals: function() {
      return _get('psk_shared_animals', null);
    },

    addTreatment: function(animalId, treatmentObj) {
      const animalsData = _get('psk_shared_animals', {});
      if (!animalsData[animalId]) animalsData[animalId] = { treatments: [] };
      if (!animalsData[animalId].treatments) animalsData[animalId].treatments = [];
      const entry = {
        id: 'trt_' + Date.now(),
        date: treatmentObj.date || new Date().toISOString().split('T')[0],
        condition: treatmentObj.condition || 'Clinical Treatment',
        medicine: treatmentObj.medicine || 'Prescribed Drug',
        dosage: treatmentObj.dosage || 'Standard dose',
        route: treatmentObj.route || 'Oral',
        duration: treatmentObj.duration || '3 days',
        notes: treatmentObj.notes || 'Recorded by veterinarian',
        vetName: treatmentObj.vetName || 'Dr. Kavita Rao'
      };
      animalsData[animalId].treatments.unshift(entry);
      _set('psk_shared_animals', animalsData);
      broadcast('psk:treatment:added', { animalId, treatment: entry });
      return entry;
    },

    updateUserStatus: function(userId, status) {
      const users = _get('psk_shared_users', {});
      users[userId] = { status, updatedAt: Date.now() };
      _set('psk_shared_users', users);
      broadcast('psk:user:updated', { userId, status });
    },

    updateCase: function(caseId, updates) {
      const cases = _get('psk_shared_cases', {});
      cases[caseId] = { ...(cases[caseId] || {}), ...updates, updatedAt: Date.now() };
      _set('psk_shared_cases', cases);
      broadcast('psk:case:updated', { caseId, updates });
    },

    updateComplaint: function(id, status) {
      const complaints = _get('psk_shared_complaints', {});
      complaints[id] = { status, updatedAt: Date.now() };
      _set('psk_shared_complaints', complaints);
      broadcast('psk:complaint:updated', { id, status });
    },

    onEvent: function(fn) {
      if (typeof fn === 'function') _listeners.add(fn);
    },

    offEvent: function(fn) {
      _listeners.delete(fn);
    },

    seedDefaultData: function() {
      if (!localStorage.getItem('psk_shared_reports')) {
        _set('psk_shared_reports', []);
      }

      if (!localStorage.getItem('psk_shared_emergencies')) {
        const defaultEmergencies = [
          { id: "emg_101", animalId: "a2", animalName: "Raju (Bullock)", farmerName: "Suresh Patil", village: "Wagholi, Pune", contact: "+91 98765 43210", severity: "critical", status: "new", title: "Severe colic & unable to stand", time: "14 min ago", assignedVet: null },
          { id: "emg_102", animalId: "a1", animalName: "Gauri (Cow)", farmerName: "Suresh Patil", village: "Wagholi, Pune", contact: "+91 98765 43210", severity: "high", status: "accepted", title: "Sudden high fever & respiratory distress", time: "35 min ago", assignedVet: "Dr. Kavita Rao" }
        ];
        _set('psk_shared_emergencies', defaultEmergencies);
      }
    }
  };
})();
</script>

function isToday(dateInput) {
  if (!dateInput) return false;
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const currentDate = now.getDate();

  if (typeof dateInput === "string") {
    const s = dateInput.trim().toLowerCase();
    if (s === "today") return true;
    const dmyMatch = s.match(/^(\d{1,2})\s+([a-z]{3,9})\s+(\d{4})$/i);
    if (dmyMatch) {
      const day = parseInt(dmyMatch[1], 10);
      const monthStr = dmyMatch[2].slice(0, 3).toLowerCase();
      const year = parseInt(dmyMatch[3], 10);
      const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
      const monthIndex = months.indexOf(monthStr);
      if (monthIndex !== -1) {
        return year === currentYear && monthIndex === currentMonth && day === currentDate;
      }
    }
  }
  return false;
}

      style={style}
    >

  );
}

  const filteredHotspots = useMemo(() => {
    return INITIAL_HOTSPOTS.filter((h) => {
      if (selectedDisease !== "all" && h.disease !== selectedDisease) return false;
      if (selectedDistrict !== "all" && h.district !== selectedDistrict) return false;
      if (selectedRisk !== "all" && h.risk.toLowerCase() !== selectedRisk.toLowerCase()) return false;
      if (dateRange === "7d" && h.daysAgo > 7) return false;
      if (dateRange === "14d" && h.daysAgo > 14) return false;
      if (dateRange === "30d" && h.daysAgo > 30) return false;
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        const match =
          h.disease.toLowerCase().includes(q) ||
          h.district.toLowerCase().includes(q) ||
          h.location.toLowerCase().includes(q) ||
          h.species.toLowerCase().includes(q);
        if (!match) return false;
      }
      return true;
    }).sort((a, b) => {
      const riskWeight = { High: 3, Medium: 2, Low: 1 };
      return (riskWeight[b.risk] || 0) - (riskWeight[a.risk] || 0);
    });
  }, [selectedDisease, selectedDistrict, selectedRisk, dateRange, searchQuery]);

  // Selected Hotspot Object
  const selectedHotspot = useMemo(() => {
    return (
      filteredHotspots.find((h) => h.id === selectedHotspotId) ||
      filteredHotspots[0] ||
      INITIAL_HOTSPOTS[0]
    );
  }, [filteredHotspots, selectedHotspotId]);

  // Leaflet Map Initialization and Update
  useEffect(() => {
    if (!mapRef.current) return;
    
    // Initialize map if it doesn't exist
    if (!mapInstanceRef.current) {
      const map = L.map(mapRef.current).setView([19.0, 75.0], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      mapInstanceRef.current = map;
    }

    const map = mapInstanceRef.current;

    // Clear old layers
    if (heatLayerRef.current) map.removeLayer(heatLayerRef.current);
    if (markerLayerRef.current) map.removeLayer(markerLayerRef.current);

    const newMarkerLayer = L.layerGroup().addTo(map);
    markerLayerRef.current = newMarkerLayer;

    const heatData = [];

    // Add Vet Markers
    if (showVetMarkers) {
      const nearbySupport = Array.from({ length: 7 }, (_, i) => ({
        id: `vs-${i+1}`,
        lat: [19.8, 18.2, 19.5, 20.5, 19.8, 18.8, 20.4][i] || 19.0,
        lng: [73.9, 74.5, 74.2, 74.5, 74.4, 74.3, 75.0][i] || 75.0,
        name: `Mobile Unit ${i+1}`
      }));
      nearbySupport.forEach(v => {
        L.circleMarker([v.lat, v.lng], {
          radius: 6, fillColor: '#1F5D50', color: '#fff', weight: 1.5, fillOpacity: 1
        }).bindTooltip(`${v.name}`).addTo(newMarkerLayer);
      });
    }

    // Add Hotspot Markers and Heatmap Data
    filteredHotspots.forEach(h => {
      const total = h.affectedAnimals + h.affectedFarms;
      if (showRiskZones) {
        // Procedurally generate a dense cluster of heatmap points for a realistic SIH demo
        const pointCount = Math.max(10, Math.min(150, (h.affectedAnimals || 0) + (h.affectedFarms || 0)));
        // Spread radius roughly 0.05 to 0.15 degrees
        const spread = (h.radius || 40) / 400; 
        
        // Push the epicenter
        heatData.push([h.lat || 19.0, h.lng || 75.0, 1.0]);
        
        for (let i = 0; i < pointCount; i++) {
          // Generate normally-distributed random offset
          const r = spread * Math.sqrt(Math.random());
          const theta = Math.random() * 2 * Math.PI;
          const latOffset = r * Math.cos(theta);
          const lngOffset = r * Math.sin(theta);
          // Intensity decays slightly from center
          const intensity = 0.4 + (Math.random() * 0.4);
          heatData.push([(h.lat || 19.0) + latOffset, (h.lng || 75.0) + lngOffset, intensity]);
        }
      }

      const isSelected = selectedHotspotId === h.id;
      const isHigh = h.risk === "High";
      const pinColor = isHigh ? "#B3402A" : h.risk === "Medium" ? "#D98B2B" : "#2F7A4F";

      const circle = L.circleMarker([h.lat || 19.0, h.lng || 75.0], {
        radius: isSelected ? 12 : 8,
        fillColor: pinColor,
        color: isSelected ? '#143F36' : '#fff',
        weight: isSelected ? 3 : 2,
        fillOpacity: 0.85
      }).bindTooltip(`${h.shortName} (${h.affectedAnimals})`)
        .on('click', () => setSelectedHotspotId(h.id))
        .addTo(newMarkerLayer);

      if (isSelected) {
        // Optional: center map smoothly on selected
        map.flyTo([h.lat || 19.0, h.lng || 75.0], 8, { duration: 0.5 });
      }
    });

    if (showRiskZones && heatData.length > 0) {
      heatLayerRef.current = L.heatLayer(heatData, {
        radius: 35, blur: 20, maxZoom: 10,
        gradient: {0.2: '#2F7A4F', 0.5: '#B9791F', 0.8: '#B3402A'}
      }).addTo(map);
    }
  }, [filteredHotspots, selectedHotspotId, showRiskZones, showVetMarkers]);

  // Priority response ranking: computed dynamically
  const rankedAreas = useMemo(() => {
    return [...filteredHotspots].sort((a, b) => {
      const weightRisk = { High: 100, Medium: 50, Low: 20 };
      const scoreA =
        (weightRisk[a.risk] || 0) +
        a.affectedAnimals * 1.5 +
        a.affectedFarms * 3 +
        parseInt(a.recentIncrease.replace(/[^0-9-]/g, "") || "0", 10) * 2 -
        a.daysAgo * 5;
      const scoreB =
        (weightRisk[b.risk] || 0) +
        b.affectedAnimals * 1.5 +
        b.affectedFarms * 3 +
        parseInt(b.recentIncrease.replace(/[^0-9-]/g, "") || "0", 10) * 2 -
        b.daysAgo * 5;
      return scoreB - scoreA;
    });
  }, [filteredHotspots]);

  // Dynamic statistics based on filtered hotspots
  const stats = useMemo(() => {
    const totalCases = filteredHotspots.reduce((acc, h) => acc + h.affectedAnimals, 0);
    const totalFarms = filteredHotspots.reduce((acc, h) => acc + h.affectedFarms, 0);
    const confirmedCount = filteredHotspots.filter((h) => h.status === "Confirmed").reduce((acc, h) => acc + h.affectedAnimals, 0);
    const suspectedCount = filteredHotspots.filter((h) => h.status === "Suspected").reduce((acc, h) => acc + h.affectedAnimals, 0);
    const highRiskZones = filteredHotspots.filter((h) => h.risk === "High").length;
    const mediumRiskZones = filteredHotspots.filter((h) => h.risk === "Medium").length;
    const lowRiskZones = filteredHotspots.filter((h) => h.risk === "Low").length;

    const newCasesPeriod = Math.round(totalCases * (trendWindow === "7d" ? 0.38 : 0.82));
    const growthPercent = highRiskZones > 1 ? "+21.4%" : "+8.7%";

    return {
      totalCases,
      totalFarms,
      confirmedCount,
      suspectedCount,
      highRiskZones,
      mediumRiskZones,
      lowRiskZones,
      newCasesPeriod,
      growthPercent,
      activeHotspotsCount: filteredHotspots.length
    };
  }, [filteredHotspots, trendWindow]);

  // Outbreak alerts (derived from filtered hotspots with urgency)
  const alertsList = useMemo(() => {
    return filteredHotspots.map((h) => ({
      ...h,
      urgency: h.risk === "High" ? "Critical Immediate Action" : h.risk === "Medium" ? "Containment Advisory" : "Precautionary Monitoring",
    }));
  }, [filteredHotspots]);

  // Support providers sorted by proximity to selected hotspot
  const nearbySupport = useMemo(() => {
    return VETERINARY_SUPPORT_PROVIDERS.map((v) => {
      const distOffset = v.district === selectedHotspot?.district ? 0 : 25.5;
      const computedDistance = (v.distanceKm + distOffset).toFixed(1);
      return {
        ...v,
        computedDistance: parseFloat(computedDistance)
      };
    }).sort((a, b) => a.computedDistance - b.computedDistance);
  }, [selectedHotspot]);

  // Simple Disease Trend: total affected animals over the last 7 days
  const trendChartData = useMemo(() => {
    const labels = ["03 Sep", "04 Sep", "05 Sep", "06 Sep", "07 Sep", "08 Sep", "Today"];
    const rawTotal = [0, 1, 2, 3, 4, 5, 6].map((idx) => {
      const sum = filteredHotspots.reduce((acc, h) => acc + (h.dailyHistory ? (h.dailyHistory[idx] || 0) : 0), 0);
      return sum > 0 ? sum : Math.round(stats.totalCases * [0.15, 0.22, 0.35, 0.5, 0.65, 0.85, 1.0][idx]);
    });

    const maxVal = Math.max(...rawTotal, 15);
    const maxY = Math.ceil(maxVal / 20) * 20 || 40;
    const ySteps = [maxY, Math.round(maxY * 0.66), Math.round(maxY * 0.33), 0];

    const count = labels.length;
    const getX = (i) => 50 + (i / (count - 1)) * (710 - 50);
    const getY = (val) => 180 - (val / maxY) * 145;

    const pts = rawTotal.map((v, i) => ({
      x: Math.round(getX(i)),
      y: Math.round(Math.min(180, Math.max(30, getY(v)))),
      val: v
    }));

    const makeLine = (pts) => {
      if (pts.length === 0) return "";
      return pts.reduce((acc, pt, i, arr) => {
        if (i === 0) return `M ${pt.x},${pt.y}`;
        const prev = arr[i - 1];
        const cp1x = Math.round(prev.x + (pt.x - prev.x) / 2);
        return `${acc} C ${cp1x},${prev.y} ${cp1x},${pt.y} ${pt.x},${pt.y}`;
      }, "");
    };

    const lineD = makeLine(pts);
    const areaD = pts.length > 0
      ? `${lineD} L ${pts[pts.length - 1].x},180 L ${pts[0].x},180 Z`
      : "";

    return {
      labels,
      pts,
      lineD,
      areaD,
      ySteps,
      maxY
    };
  }, [filteredHotspots, stats.totalCases]);

  // Dispatch Support Handler
  const handleDispatchSupport = (vetId, vetName) => {
    setDispatchedUnits((prev) => ({
      ...prev,
      [vetId]: true
    }));
    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.addEmergency({
        animalId: "hotspot_" + vetId,
        animalName: selectedHotspot?.location || "Outbreak Zone",
        farmerName: "Field Unit",
        village: selectedHotspot?.location || "Regional Hotspot",
        contact: "1962 Helpline",
        severity: "critical",
        status: "accepted",
        title: `Outbreak Response Unit Dispatched: ${selectedHotspot?.disease || "Disease Hotspot"}`,
        time: "Just now",
        assignedVet: vetName
      });
    }
    showToast(`Emergency alert dispatched to ${vetName} for ${selectedHotspot?.location}!`);
  };

  // Reset Filters Handler
  const handleResetFilters = () => {
    setSelectedDisease("all");
    setSelectedDistrict("all");
    setSelectedRisk("all");
    setDateRange("30d");
    setSearchQuery("");
    showToast("Filters reset to default view.");
  };

  return (
    <div className="heatmap-container">
      {/* Top Header Banner for Monitoring */}
      <div className="hm-header-banner">
        <div className="hm-title-area">
          <div className="hm-badge-live">
            <span className="live-pulsing-dot" />
            LIVE SURVEILLANCE FEED
          </div>
          <h1 className="hm-title">{t("auto_veterinary_dise", "Veterinary Disease Monitoring & Hotspot Map")}</h1>
          <p className="hm-sub">{t("auto_real_time_geosp", `Real-time geospatial epidemiological surveillance across Western Maharashtra livestock basins.
            Connected with veterinary stations, outbreak containment rings, and mobile dispatch units.`)}</p>
        </div>

        <div className="hm-header-actions">
          <button
            className="btn-outline btn-sm"
            style={{ color: "#fff", borderColor: "rgba(255,255,255,0.3)" }}
            onClick={() => {
              showToast("Epidemiological surveillance dataset exported.");
            }}
            title="Export Outbreak Report"
          >
            <Download size={15} />
            Export Data
          </button>
        </div>
      </div>

      {/* Primary KPI Metrics Strip */}
      <div className="hm-stat-row">
        <div className="hm-stat-box">
          <div className="hm-stat-top">
            <span className="hm-stat-icon red"><Flame size={16} /></span>
            <span className="hm-stat-tag red">{stats.highRiskZones} High Risk</span>
          </div>
          <div className="hm-stat-num">{stats.totalCases}</div>
          <div className="hm-stat-lbl">{t("auto_affected_animal", "Affected Animals")}</div>
          <div className="hm-stat-foot red-text">{stats.growthPercent} vs prev period</div>
        </div>

        <div className="hm-stat-box">
          <div className="hm-stat-top">
            <span className="hm-stat-icon orange"><MapPinned size={16} /></span>
            <span className="hm-stat-tag orange">{filteredHotspots.length} Zones</span>
          </div>
          <div className="hm-stat-num">{stats.activeHotspotsCount}</div>
          <div className="hm-stat-lbl">{t("auto_active_hotspots", "Active Hotspots")}</div>
          <div className="hm-stat-foot">{stats.mediumRiskZones} Medium · {stats.lowRiskZones} Low</div>
        </div>

        <div className="hm-stat-box">
          <div className="hm-stat-top">
            <span className="hm-stat-icon red"><ShieldAlert size={16} /></span>
            <span className="hm-stat-tag red">{t("auto_urgent", "Urgent")}</span>
          </div>
          <div className="hm-stat-num">{stats.highRiskZones}</div>
          <div className="hm-stat-lbl">{t("auto_high_risk_zones", "High-Risk Zones")}</div>
          <div className="hm-stat-foot red-text">{t("auto_require_immedia", "Require immediate containment")}</div>
        </div>

        <div className="hm-stat-box">
          <div className="hm-stat-top">
            <span className="hm-stat-icon teal"><Building2 size={16} /></span>
            <span className="hm-stat-tag teal">{t("auto_farms", "Farms")}</span>
          </div>
          <div className="hm-stat-num">{stats.totalFarms}</div>
          <div className="hm-stat-lbl">{t("auto_affected_farms", "Affected Farms")}</div>
          <div className="hm-stat-foot">Across {districtOptions.length - 1} districts monitored</div>
        </div>
      </div>

      {/* Dynamic Filter & Control Toolbar */}
      <Card className="hm-filter-card">
        <div className="hm-filter-top">
          <div className="hm-filter-title">
            <SlidersHorizontal size={17} style={{ color: "var(--brand)" }} />
            <span>{t("auto_surveillance_fi", "Surveillance Filters & Sorting")}</span>
            {filteredHotspots.length < INITIAL_HOTSPOTS.length && (
              <span className="badge badge-info" style={{ marginLeft: 8 }}>
                {filteredHotspots.length} of {INITIAL_HOTSPOTS.length} shown
              </span>
            )}
          </div>
          <button className="hm-reset-btn" onClick={handleResetFilters}>
            <RefreshCcw size={13} />
            Reset Filters
          </button>
        </div>

        <div className="hm-filter-grid">
          {/* Disease Filter */}
          <div className="hm-control-group">
            <label className="hm-control-label">{t("auto_disease_type", "Disease Type")}</label>
            <select
              className="hm-select"
              value={selectedDisease}
              onChange={(e) => setSelectedDisease(e.target.value)}
            >
              {diseaseOptions.map((o) => (
                <option key={o.value} value={o.value}>{o.label}</option>
              ))}
            </select>
          </div>

          {/* District Filter */}
          <div className="hm-control-group">
            <label className="hm-control-label">{t("auto_district___regi", "District / Region")}</label>
            <select
              className="hm-select"
              value={selectedDistrict}
              onChange={(e) => setSelectedDistrict(e.target.value)}
            >
              {districtOptions.map((o) => (
                <option key={o.value} value={o.value}>{o.label}</option>
              ))}
            </select>
          </div>

          {/* Risk Level Filter */}
          <div className="hm-control-group">
            <label className="hm-control-label">{t("auto_risk_level", "Risk Level")}</label>
            <select
              className="hm-select"
              value={selectedRisk}
              onChange={(e) => setSelectedRisk(e.target.value)}
            >
              <option value="all">All Risk Levels</option>
              <option value="High">High Risk Zones</option>
              <option value="Medium">Medium Risk Zones</option>
              <option value="Low">Low Risk Zones</option>
            </select>
          </div>

          {/* Date Range Filter */}
          <div className="hm-control-group">
            <label className="hm-control-label">{t("auto_date_window", "Date Window")}</label>
            <select
              className="hm-select"
              value={dateRange}
              onChange={(e) => setDateRange(e.target.value)}
            >
              <option value="7d">Last 7 Days</option>
              <option value="14d">Last 14 Days</option>
              <option value="30d">Last 30 Days</option>
              <option value="all">All Recorded (90 Days)</option>
            </select>
          </div>

          {/* Sorting (simplified to Risk only) */}
          <div className="hm-control-group">
            <label className="hm-control-label">{t("auto_sort_by", "Sort By")}</label>
            <select className="hm-select" value="risk" disabled>
              <option value="risk">Risk (High to Low)</option>
            </select>
          </div>
        </div>

        {/* Secondary search controls */}
        <div className="hm-filter-subrow">
          <div className="hm-search-wrap">
            <Search size={15} style={{ color: "var(--ink-soft)" }} />
            <input
              type="text"
              placeholder="Search hotspots by disease, taluka, village, or livestock type..."
              className="hm-search-input"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />
            {searchQuery && (
              <button className="hm-clear-search" onClick={() => setSearchQuery("")}><X size={14} /></button>
            )}
          </div>
        </div>
      </Card>

      {/* Main Grid: Interactive Map + Hotspot Inspector */}
      <div className="hm-main-layout">
        {/* LEFT COLUMN: Map & Quick Layer Toggles */}
        <div className="hm-map-column">
          <Card className="hm-map-card">
            {/* Map Header Controls */}
            <div className="hm-map-header">
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <MapPinned size={18} style={{ color: "var(--brand)" }} />
                <h3 style={{ margin: 0, fontSize: 16, fontWeight: 700 }}>{t("auto_interactive_hot", "Interactive Hotspot Map")}</h3>
                <span className="badge badge-info" style={{ fontSize: 11 }}>{t("auto_maharashtra_liv", "Maharashtra Livestock Belt")}</span>
              </div>

              <div className="hm-layer-switches">
                <button
                  className={`layer-chip ${showRiskZones ? "active" : ""}`}
                  onClick={() => setShowRiskZones(!showRiskZones)}
                  title="Toggle High/Medium/Low Heat Radii"
                >
                  <Layers size={13} />
                  Risk Radii
                </button>
                <button
                  className={`layer-chip ${showVetMarkers ? "active" : ""}`}
                  onClick={() => setShowVetMarkers(!showVetMarkers)}
                  title="Toggle Nearby Vet Support Facilities"
                >
                  <Stethoscope size={13} />
                  Vet Clinics
                </button>
                <button
                  className="layer-chip"
                  onClick={() => {
                    setSelectedHotspotId(filteredHotspots[0]?.id || "HS-01");
                    showToast("Map view re-centered on highest priority cluster.");
                  }}
                  title="Reset Map Center"
                >
                  <Crosshair size={13} />
                  Re-center
                </button>
              </div>
            </div>

            {/* Interactive Cartographic Canvas */}
            <div className="hm-canvas-wrapper">
              <div ref={mapRef} style={{ width: '100%', height: '100%', minHeight: '650px', background: '#EFE8D8' }} />

              {/* Floating Map Legend Overlay */}
              <div className="hm-map-legend">
                <div className="hm-legend-title">{t("auto_surveillance_ke", "Surveillance Key")}</div>
                <div className="hm-legend-item">
                  <span className="hm-legend-dot red" />
                  <span>{t("auto_high_risk_zone_", "High Risk Zone (&gt;35 cases)")}</span>
                </div>
                <div className="hm-legend-item">
                  <span className="hm-legend-dot orange" />
                  <span>{t("auto_medium_risk__15", "Medium Risk (15-35 cases)")}</span>
                </div>
                <div className="hm-legend-item">
                  <span className="hm-legend-dot green" />
                  <span>{t("auto_low___controlle", "Low / Controlled (&lt;15 cases)")}</span>
                </div>
                <div className="hm-legend-divider" />
                <div className="hm-legend-item">
                  <span className="hm-legend-shape solid" />
                  <span>{t("auto_confirmed_outbr", "Confirmed Outbreak")}</span>
                </div>
                <div className="hm-legend-item">
                  <span className="hm-legend-shape dashed" />
                  <span>{t("auto_suspected___inv", "Suspected / Investigating")}</span>
                </div>
                <div className="hm-legend-item">
                  <span className="hm-legend-icon-tag"><Stethoscope size={11} /></span>
                  <span>{t("auto_veterinary_supp", "Veterinary Support Depot")}</span>
                </div>
              </div>
            </div>
          </Card>
        </div>

        {/* RIGHT COLUMN: Active Hotspot Deep Inspector */}
        <div className="hm-detail-column">
          <Card className="hm-hotspot-panel">
            <div className="hm-panel-header">
              <div>
                <span className="badge badge-info" style={{ marginBottom: 4 }}>
                  Hotspot #{selectedHotspot.id} · {selectedHotspot.district}
                </span>
                <h2 className="hm-panel-title">{selectedHotspot.disease}</h2>
                <div className="hm-panel-loc">
                  <MapPin size={14} style={{ color: "var(--brand)", verticalAlign: -2 }} />
                  {selectedHotspot.location}
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <RiskPill risk={selectedHotspot.risk} />
                <div style={{ marginTop: 6 }}>
                  <StatusPill status={selectedHotspot.status === "Confirmed" ? "resolved" : "attention"} />
                </div>
              </div>
            </div>

            {/* Core Impact Figures */}
            <div className="hm-impact-grid">
              <div className="hm-impact-cell">
                <span className="hm-impact-val red">{selectedHotspot.affectedAnimals}</span>
                <span className="hm-impact-lbl">{t("auto_animals_affecte", "Animals Affected")}</span>
                <span className="hm-impact-sub">{selectedHotspot.species}</span>
              </div>
              <div className="hm-impact-cell">
                <span className="hm-impact-val">{selectedHotspot.affectedFarms}</span>
                <span className="hm-impact-lbl">{t("auto_farms_impacted", "Farms Impacted")}</span>
                <span className="hm-impact-sub">{selectedHotspot.recentIncrease} 7-day trend</span>
              </div>
              <div className="hm-impact-cell">
                <span className="hm-impact-val">{selectedHotspot.date.split(" ")[0]} {selectedHotspot.date.split(" ")[1]}</span>
                <span className="hm-impact-lbl">{t("auto_first_reported", "First Reported")}</span>
                <span className="hm-impact-sub">{selectedHotspot.daysAgo === 0 ? "Today" : `${selectedHotspot.daysAgo}d ago`}</span>
              </div>
            </div>

            {/* Spread Summary & Epidemiological Notes */}
            <div className="hm-info-block">
              <div className="hm-info-heading">
                <Flame size={14} style={{ color: "var(--urgent)" }} />
                <span>{t("auto_spread_dynamics", "Spread Dynamics & Pattern")}</span>
              </div>
              <p className="hm-info-text">{selectedHotspot.spreadSummary}</p>
            </div>

            <div className="hm-info-block" style={{ borderLeftColor: "var(--brand)" }}>
              <div className="hm-info-heading">
                <ShieldCheck size={14} style={{ color: "var(--brand)" }} />
                <span>{t("auto_recommended_vet", "Recommended Veterinary Protocol")}</span>
              </div>
              <p className="hm-info-text">{selectedHotspot.advisory}</p>
            </div>

            {/* Mini Outbreak Trend Sparkline */}
            <div className="hm-spark-wrap">
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ fontSize: 12.5, fontWeight: 700, color: "var(--ink-soft)" }}>{t("auto_7_day_progressi", "7-Day Progression Sparkline")}</span>
                <span style={{ fontSize: 12, fontWeight: 700, color: "var(--urgent)" }}>{selectedHotspot.recentIncrease}</span>
              </div>
              <div className="hm-spark-bars">

              <svg className="hm-trend-svg" viewBox="0 0 750 240" preserveAspectRatio="none">
                {/* Horizontal Grid lines */}
                <line x1="40" y1="35" x2="730" y2="35" stroke="#E3DCC8" strokeDasharray="3 3" />
                <line x1="40" y1="83" x2="730" y2="83" stroke="#E3DCC8" strokeDasharray="3 3" />
                <line x1="40" y1="131" x2="730" y2="131" stroke="#E3DCC8" strokeDasharray="3 3" />

                {/* Y Axis Labels */}
                <text x="15" y="39" fill="#99917B" fontSize="11">{trendChartData.ySteps[0]}</text>
                <text x="20" y="87" fill="#99917B" fontSize="11">{trendChartData.ySteps[1]}</text>

                {/* Trend Area & Line */}
                <path

                <path
                  d={trendChartData.lineD}

                  stroke="#B3402A"
                  strokeWidth="3.2"

                {/* Data Points */}
                {trendChartData.pts.map((pt, i) => (
                  <g key={i}>
                    <circle cx={pt.x} cy={pt.y} r="5" fill="#B3402A" stroke="#FFFFFF" strokeWidth="2" />

          {/* Increasing Risk Hotspots Card */}

              <TrendingUp size={16} style={{ color: "var(--urgent)" }} />

            <div className="hm-growth-list">
              {filteredHotspots.slice(0, 4).map((h) => (
                <div
                  key={h.id}

        </div>
      </div>



    </div>
  );
}

function VetApp() {
  const [view, setView] = useState("overview");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [availability, setAvailability] = useState("available");

  const [requests, setRequests] = useState(initialRequests);
  const [reports, setReports] = useState(initialReports);
  const [emergencies, setEmergencies] = useState(initialEmergencies);
  const [patients, setPatients] = useState(initialPatients);
  const [treatmentHistory, setTreatmentHistory] = useState(treatmentHistoryData);
  const [notifications, setNotifications] = useState(initialNotifications);

  const [profile, setProfile] = useState(VET_PROFILE);
  const [appLanguage, setAppLanguage] = useState(localStorage.getItem('psk_language') || "en");
  const [textSize, setTextSize] = useState("Medium");
  const [theme, setTheme] = useState("Light");
  const [highContrast, setHighContrast] = useState(false);
  const [notificationPreferences, setNotificationPreferences] = useState(true);
  const [reminderTiming, setReminderTiming] = useState("At scheduled time");

  useEffect(() => {
    localStorage.setItem('psk_language', appLanguage);
  }, [appLanguage]);

  const [selectedPatientId, setSelectedPatientId] = useState("gauri");
  const [patientSearch, setPatientSearch] = useState("");
  const [reportFilter, setReportFilter] = useState("All");
  const [emergencyFilter, setEmergencyFilter] = useState("All");
  const t = (key, fallback) => tt(appLanguage, key, fallback);

  const showToast = (msg) => {
    setToast(msg);
    window.setTimeout(() => setToast(null), 3200);
  };

  // Bridge Integration: sync session, reports, emergencies, and live events
  useEffect(() => {
    if (!window.PashuSakhiBridge) return;

    // Check active session from portal
    const sess = window.PashuSakhiBridge.getSession();
    if (sess && sess.name) {
      setProfile((prev) => ({ ...prev, name: sess.name, email: sess.email || prev.email }));
    }

    // Load and merge persisted bridge reports
    const bridgeReports = window.PashuSakhiBridge.getReports();
    if (bridgeReports && bridgeReports.length > 0) {
      setReports((prev) => {
        const existingIds = new Set(prev.map((r) => r.id));
        const toAdd = bridgeReports.filter((r) => !existingIds.has(r.id));
        return [...toAdd, ...prev];
      });
    }

    // Load and merge persisted bridge emergencies
    const bridgeEmergencies = window.PashuSakhiBridge.getEmergencies();
    if (bridgeEmergencies && bridgeEmergencies.length > 0) {
      setEmergencies((prev) => {
        const existingIds = new Set(prev.map((e) => e.id));
        const toAdd = bridgeEmergencies.filter((e) => !existingIds.has(e.id));
        return [...toAdd, ...prev];
      });
    }

    // Load live backend emergencies
    if (window.PashuSakhiApi) {
      window.PashuSakhiApi.getEmergencies()
        .then(res => {
          if (res && res.success && Array.isArray(res.data) && res.data.length > 0) {
            const mapped = res.data.map(mapBackendEmergency);
            setEmergencies(prev => {
              const ids = new Set(prev.map(p => p.id));
              const fresh = mapped.filter(m => !ids.has(m.id));
              return [...fresh, ...prev];
            });
          }
        })
        .catch(err => console.warn('Backend getEmergencies fallback:', err));
    }

    // Listen for live bridge updates across tabs
    const handleBridgeEvent = (eventName, data) => {
      if (eventName === "psk:report:added" && data) {
        setReports((prev) => {
          if (prev.some((r) => r.id === data.id)) return prev;
          return [data, ...prev];
        });
        showToast(`New AI Report submitted for ${data.animalName || 'livestock'}.`);
      } else if (eventName === "psk:emergency:added" && data) {
        setEmergencies((prev) => {
          if (prev.some((e) => e.id === data.id)) return prev;
          return [data, ...prev];
        });
        showToast(`🚨 Emergency Alert: ${data.title || data.animalName}!`);
      } else if (eventName === "psk:chat:message" && data && data.message) {
        if (data.message.sender === "farmer") {
          setRequests((prev) => {
            const reqIdx = prev.findIndex((r) => r.animalId === data.animalId);
            if (reqIdx >= 0) {
              const updated = [...prev];
              updated[reqIdx] = {
                ...updated[reqIdx],
                symptoms: data.message.text,
                submitted: "Just now",
                status: "new"
              };
              return updated;
            }
            return [
              {
                id: "req_" + Date.now(),
                animalId: data.animalId,
                animal: "Patient " + (data.animalId.toUpperCase()),
                farmer: "Suresh Patil",
                symptoms: data.message.text,
                priority: "critical",
                status: "new",
                submitted: "Just now"
              },
              ...prev
            ];
          });
          showToast(`New consultation message from farmer.`);
        }
      }
    };

    window.PashuSakhiBridge.onEvent(handleBridgeEvent);
    return () => {
      window.PashuSakhiBridge.offEvent(handleBridgeEvent);
    };
  }, []);

  const unreadCount = notifications.filter((n) => !n.read).length;
  const emergencyCount = emergencies.filter((e) => e.status !== "resolved").length;
  const pendingReportsCount = reports.filter((r) => r.status === "New" || r.status === "Under Review").length;
  const unreadRequestsCount = requests.filter((r) => r.status === "new" || r.status === "unread").length;
  const followUpsToday = patients.reduce((sum, p) => {
    if (!p.followUps) return sum;
    return sum + p.followUps.filter((f) => isToday(f.date)).length;
  }, 0);

  // Navigation Items: Added "Heat Map" right after Overview
  const NAV = [
    { id: "overview", label: t("nav_overview", "Overview"), Icon: Home },
    { id: "heatmap", label: t("nav_heatmap", "Heat Map"), Icon: MapPinned, badge: "Live" },
    { id: "requests", label: t("nav_chatRequests", "Chat Requests"), Icon: MessageCircle, badge: unreadRequestsCount },
    { id: "reports", label: t("nav_aiReports", "AI Reports"), Icon: FileText, badge: pendingReportsCount },
    { id: "emergency", label: t("nav_emergencyCases", "Emergency Cases"), Icon: Siren, badge: emergencyCount },
    { id: "patients", label: t("nav_patientRecords", "Patient Records"), Icon: PawPrint },
    { id: "settings", label: t("nav_settings", "Settings"), Icon: Settings },
  ];

  const rootStyle = {
    fontSize: textSize === "Small" ? "14px" : textSize === "Large" ? "17px" : "15px",
    ...(theme === "Dark" ? {
      "--paper": "#1B211E", "--paper-soft": "#232A26", "--ink": "#F3F0E6",
      "--ink-soft": "#B8C2BB", "--line": "#3C4741", "--brand-soft": "#29453D",
      "--healthy-soft": "#294534", "--attention-soft": "#4A4028", "--urgent-soft": "#4A2B24"
    } : {}),
    ...(highContrast ? {"--line": theme === "Dark" ? "#E7E2D4" : "#20261F", "--ink-soft": theme === "Dark" ? "#F3F0E6" : "#30372F"} : {})
  };

  const updateReport = (id, status) => {
    setReports(prev => prev.map(r => r.id === id ? { ...r, status } : r));
    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.updateReportStatus(id, status);
    }
    showToast(`AI report ${id} marked ${status}.`);
  };

  const updateEmergency = (id, status) => {
    setEmergencies(prev => prev.map(e => e.id === id ? {
      ...e, status, assignedVet: status === "accepted" ? profile.name : e.assignedVet
    } : e));
    if (window.PashuSakhiApi) {
      if (status === "accepted") {
        window.PashuSakhiApi.acceptEmergency(id).catch(e => console.warn('Backend acceptEmergency error:', e));
      } else {
        window.PashuSakhiApi.updateEmergencyStatus(id, status.toUpperCase()).catch(e => console.warn('Backend updateEmergencyStatus error:', e));
      }
    }
    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.updateEmergencyStatus(id, status, profile.name);
    }
    showToast(`Emergency ${id} updated.`);
  };

  const addTreatment = (animalId) => {
    const entry = {
      date: new Date().toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}),
      condition: "Clinical treatment added",
      medicine: "Oxytetracycline / Topical Antiseptic",
      dosage: "10ml I.M.",
      route: "Intramuscular",
      duration: "3 days",
      notes: "New treatment entry created by veterinarian Dr. Kavita Rao.",
      followUp: "In 3 days",
      attachments: 0
    };
    if (window.PashuSakhiApi) {
      window.PashuSakhiApi.createTreatment(animalId, {
        diagnosis: entry.condition,
        medication: entry.medicine,
        dosage: entry.dosage,
        instructions: entry.notes
      }).catch(e => console.warn('Backend createTreatment error:', e));
    }
    setTreatmentHistory(prev => ({
      ...prev,
      [animalId]: [
        ...(prev[animalId] || []),
        entry
      ]
    }));
    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.addTreatment(animalId, entry);
    }
    showToast("New treatment entry added to patient history.");
  };

  const handleLogout = () => {
    if (window.PashuSakhiBridge) window.PashuSakhiBridge.clearSession();
    window.location.href = "index.html?logout=true";
  };

  const filteredPatients = patients.filter(p => {
    const q = patientSearch.trim().toLowerCase();
    return !q || [p.name, p.earTag, p.owner, p.species, p.breed, p.location].some(v => String(v).toLowerCase().includes(q));
  });

  const filteredReports = reports.filter(r => reportFilter === "All" || r.status === reportFilter);
  const filteredEmergencies = emergencies.filter(e => emergencyFilter === "All" || e.status === emergencyFilter.toLowerCase());

  return (
    <LanguageContext.Provider value={{ t, appLanguage, setAppLanguage }}>

        .toggle.on { background:var(--brand); color:#fff; border-color:var(--brand); }

        @media(max-width:900px){ .patient-layout,.settings-grid{grid-template-columns:1fr;} .detail-grid{grid-template-columns:repeat(2,1fr);} .history-card{grid-template-columns:1fr 1fr;} .search-box{min-width:100%;} }

        ) : view === "settings" ? (

                          const val = e.target.value.trim();

                                sender: "vet",
                                text: val,
                                time: "Just now"
                              });

                            e.target.value = "";
                            setRequests(prev => prev.map(item => item.id === r.id ? { ...item, status: "replied" } : item));

                        }
                      }}

                          const animalId = r.animalId || "a1";
                          if (window.PashuSakhiBridge) {
                            window.PashuSakhiBridge.sendChat(animalId, {
                              sender: "vet",
                              text: val,
                              time: "Just now"
                            });
                          }
                          showToast(`Reply dispatched to ${r.farmer || "farmer"}.`);

                <p className="stat-label">{t("auto_active_cases", "Active Cases")}</p>
              </div>
              <div className="stat-card" onClick={() => setView("heatmap")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--urgent-soft)", color: "var(--urgent)" }}><Flame size={16} /></div></div>
                <p className="stat-value">{INITIAL_HOTSPOTS.length}</p>
                <p className="stat-label">{t("auto_disease_hotspot", "Disease Hotspots")}</p>
              </div>
            </div>

            <Card style={{ marginBottom: 20, background: "linear-gradient(135deg, #143F36 0%, #1F5D50 100%)", color: "#fff" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14 }}>
                <div>
                  <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 800, background: "rgba(255,255,255,0.15)", padding: "3px 9px", borderRadius: 999, marginBottom: 6 }}>
                    <Flame size={12} color="#D98B2B" />
                    REGIONAL EPIDEMIOLOGY ALERT
                  </div>
                  <h3 style={{ margin: "0 0 4px", fontSize: 18, fontFamily: "Fraunces, serif" }}>{t("auto_active_hotspots", "Active Hotspots Detected in Nashik & Pune Districts")}</h3>
                  <p style={{ margin: 0, fontSize: 13.5, opacity: 0.9 }}>{t("auto_lumpy_skin_dise", "Lumpy Skin Disease (LSD) and FMD containment rings currently active. View geographical risk mapping and mobile units.")}</p>
                </div>
                <button className="btn-primary" style={{ background: "var(--accent)", color: "#2A1B04" }} onClick={() => setView("heatmap")}><MapPinned size={16}/> Open Heat Map Dashboard</button>
              </div>
            </Card>

            <SectionTitle>Priority Cases</SectionTitle>
            <Card style={{ padding: "4px 18px", marginBottom: 22 }}>
              {requests.slice(0, 4).map((r) => (
                <div key={r.id} className="list-row">
                  <Avatar label={r.animal} size={44} tone={r.priority === "critical" ? "urgent" : "attention" } />
                  <div className="list-row-info">
                    <p className="list-row-title">{r.animal} <span style={{ fontWeight: 500, color: "var(--ink-soft)" }}>· {r.farmer}</span></p>
                    <p className="list-row-symptoms">{r.symptoms}</p>
                    <div className="list-row-badges"><SeverityBadge level={r.priority} /><StatusPill status={r.status} /><span className="list-row-meta" style={{ margin: 0 }}>{r.submitted}</span></div>
                  </div>
                  <button className="btn-outline btn-sm" onClick={() => setView("requests")}>Open Case</button>
                </div>
              ))}
            </Card>
          </>
        )}
      </main>

      {/* Toast Feedback */}
      {toast && <div className="toast">{toast}</div>}
      </div>
    </LanguageContext.Provider>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<VetApp />);
</script>
</body>
</html>
