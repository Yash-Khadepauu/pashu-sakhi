<script src="pashusakhi_api.js"></script>
<script>
(function() {
  const _tabId = 'tab_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
  const _listeners = new Set();

  function _get(key, defaultVal) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : defaultVal;
    } catch (e) {
      return defaultVal;
    }
  }

  function _set(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      console.warn('PashuSakhiBridge storage write failed:', e);
    }
  }

  function broadcast(event, data) {
    const payload = { event, data, timestamp: Date.now(), sourceId: _tabId };
    try {
      localStorage.setItem('psk_bridge_event', JSON.stringify(payload));
    } catch (e) {}
    _listeners.forEach(fn => {
      try { fn(event, data); } catch (err) { console.error('PashuSakhiBridge listener error:', err); }
    });
  }

  window.addEventListener('storage', function(e) {
    if (e.key === 'psk_bridge_event' && e.newValue) {
      try {
        const payload = JSON.parse(e.newValue);
        if (payload && payload.sourceId !== _tabId) {
          _listeners.forEach(fn => {
            try { fn(payload.event, payload.data); } catch (err) { console.error('PashuSakhiBridge cross-tab listener error:', err); }
          });
        }
      } catch (err) {}
    }
  });

  window.PashuSakhiBridge = {
    tabId: _tabId,

    setSession: function(sessionObj) {
      _set('psk_session', sessionObj);
      if (sessionObj && sessionObj.language) {
        try {
          localStorage.setItem('psk_language', sessionObj.language);
          localStorage.setItem('lumen_selected_language', sessionObj.language);
        } catch (e) {}
      }
      broadcast('psk:session:updated', sessionObj);
    },

    getSession: function() {
      return _get('psk_session', null);
    },

    clearSession: function() {
      try {
        localStorage.removeItem('psk_session');
        localStorage.removeItem('session:current');
        localStorage.removeItem('pashusakhi_user');
      } catch (e) {}
      broadcast('psk:session:cleared', {});
    },

    getReports: function(filter) {
      const all = _get('psk_shared_reports', []);
      if (!filter || filter === 'All') return all;
      return all.filter(r => (r.status || '').toLowerCase() === filter.toLowerCase());
    },

    addReport: function(report) {
      const reports = _get('psk_shared_reports', []);
      const newRep = {
        id: report.id || ('rep_' + Date.now()),
        type: report.type || 'screening',
        animalId: report.animalId || 'a1',
        animalName: report.animalName || 'Livestock',
        farmerName: report.farmerName || 'Suresh Patil',
        date: report.date || new Date().toISOString().split('T')[0],
        condition: report.condition || 'Suspected condition',
        severity: report.severity || 'attention',
        confidence: report.confidence || 85,
        status: report.status || 'New',
        details: report.details || {},
        farmerNotes: report.farmerNotes || null,
        voiceTranscript: report.voiceTranscript || null,
        symptoms: report.symptoms || null
      };
      reports.unshift(newRep);
      _set('psk_shared_reports', reports);
      broadcast('psk:report:added', newRep);
      return newRep;
    },

    updateReportStatus: function(id, status) {
      const reports = _get('psk_shared_reports', []);
      let updated = null;
      const next = reports.map(r => {
        if (r.id === id) {
          updated = { ...r, status };
          return updated;
        }
        return r;
      });
      _set('psk_shared_reports', next);
      if (updated) broadcast('psk:report:updated', updated);
      return updated;
    },

    getEmergencies: function(filter) {
      const all = _get('psk_shared_emergencies', []);
      if (!filter || filter === 'All') return all;
      return all.filter(e => (e.status || '').toLowerCase() === filter.toLowerCase());
    },

    addEmergency: function(emergency) {
      const emergencies = _get('psk_shared_emergencies', []);
      const newEmg = {
        id: emergency.id || ('emg_' + Date.now()),
        animalId: emergency.animalId || 'a1',
        animalName: emergency.animalName || 'Livestock',
        farmerName: emergency.farmerName || 'Suresh Patil',
        village: emergency.village || 'Wagholi, Pune',
        contact: emergency.contact || '+91 98765 43210',
        severity: emergency.severity || 'critical',
        status: emergency.status || 'new',
        title: emergency.title || 'Emergency Case',
        time: emergency.time || 'Just now',
        assignedVet: emergency.assignedVet || null
      };
      emergencies.unshift(newEmg);
      _set('psk_shared_emergencies', emergencies);
      broadcast('psk:emergency:added', newEmg);
      return newEmg;
    },

    updateEmergencyStatus: function(id, status, vetName) {
      const emergencies = _get('psk_shared_emergencies', []);
      let updated = null;
      const next = emergencies.map(e => {
        if (e.id === id) {
          updated = {
            ...e,
            status,
            assignedVet: vetName || e.assignedVet || 'Dr. Kavita Rao'
          };
          return updated;
        }
        return e;
      });
      _set('psk_shared_emergencies', next);
      if (updated) broadcast('psk:emergency:updated', updated);
      return updated;
    },

    getChats: function(animalId) {
      const chats = _get('psk_shared_chats', {});
      return animalId ? (chats[animalId] || []) : chats;
    },

    sendChat: function(animalId, msg) {
      const chats = _get('psk_shared_chats', {});
      if (!chats[animalId]) chats[animalId] = [];
      const newMsg = {
        id: msg.id || ('msg_' + Date.now()),
        sender: msg.sender || 'farmer',
        text: msg.text || '',
        time: msg.time || 'Just now',
        timestamp: Date.now(),
        animalId: animalId
      };
      chats[animalId].push(newMsg);
      _set('psk_shared_chats', chats);
      broadcast('psk:chat:message', { animalId, message: newMsg });
      return newMsg;
    },

    getAnimals: function() {
      return _get('psk_shared_animals', null);
    },

    addTreatment: function(animalId, treatmentObj) {
      const animalsData = _get('psk_shared_animals', {});
      if (!animalsData[animalId]) animalsData[animalId] = { treatments: [] };
      if (!animalsData[animalId].treatments) animalsData[animalId].treatments = [];
      const entry = {
        id: 'trt_' + Date.now(),
        date: treatmentObj.date || new Date().toISOString().split('T')[0],
        condition: treatmentObj.condition || 'Clinical Treatment',
        medicine: treatmentObj.medicine || 'Prescribed Drug',
        dosage: treatmentObj.dosage || 'Standard dose',
        route: treatmentObj.route || 'Oral',
        duration: treatmentObj.duration || '3 days',
        notes: treatmentObj.notes || 'Recorded by veterinarian',
        vetName: treatmentObj.vetName || 'Dr. Kavita Rao'
      };
      animalsData[animalId].treatments.unshift(entry);
      _set('psk_shared_animals', animalsData);
      broadcast('psk:treatment:added', { animalId, treatment: entry });
      return entry;
    },

    updateUserStatus: function(userId, status) {
      const users = _get('psk_shared_users', {});
      users[userId] = { status, updatedAt: Date.now() };
      _set('psk_shared_users', users);
      broadcast('psk:user:updated', { userId, status });
    },

    updateCase: function(caseId, updates) {
      const cases = _get('psk_shared_cases', {});
      cases[caseId] = { ...(cases[caseId] || {}), ...updates, updatedAt: Date.now() };
      _set('psk_shared_cases', cases);
      broadcast('psk:case:updated', { caseId, updates });
    },

    updateComplaint: function(id, status) {
      const complaints = _get('psk_shared_complaints', {});
      complaints[id] = { status, updatedAt: Date.now() };
      _set('psk_shared_complaints', complaints);
      broadcast('psk:complaint:updated', { id, status });
    },

    onEvent: function(fn) {
      if (typeof fn === 'function') _listeners.add(fn);
    },

    offEvent: function(fn) {
      _listeners.delete(fn);
    },

    seedDefaultData: function() {
      if (!localStorage.getItem('psk_shared_reports')) {
        const defaultReports = [
          { id: "rep_101", type: "detection", animalId: "a1", animalName: "Gauri (Cow)", farmerName: "Suresh Patil", date: new Date().toISOString().split('T')[0], condition: "Suspected Bovine Dermatitis", severity: "attention", confidence: 87, status: "Under Review", details: { title: "Suspected Bovine Dermatitis / Cutaneous Lesions" } },
          { id: "rep_102", type: "detection", animalId: "a2", animalName: "Raju (Bullock)", farmerName: "Suresh Patil", date: new Date().toISOString().split('T')[0], condition: "Suspected Nodular Skin Lesions", severity: "urgent", confidence: 91, status: "New", details: { title: "Suspected Nodular Skin Lesions" } },
          { id: "rep_103", type: "screening", animalId: "a3", animalName: "Lakshmi (Buffalo)", farmerName: "Suresh Patil", date: new Date().toISOString().split('T')[0], condition: "Mild Bloat & Lethargy", severity: "attention", confidence: 82, status: "Resolved", details: { title: "Mild Bloat" } }
        ];
        _set('psk_shared_reports', defaultReports);
      }

      if (!localStorage.getItem('psk_shared_emergencies')) {
        const defaultEmergencies = [
          { id: "emg_101", animalId: "a2", animalName: "Raju (Bullock)", farmerName: "Suresh Patil", village: "Wagholi, Pune", contact: "+91 98765 43210", severity: "critical", status: "new", title: "Severe colic & unable to stand", time: "14 min ago", assignedVet: null },
          { id: "emg_102", animalId: "a1", animalName: "Gauri (Cow)", farmerName: "Suresh Patil", village: "Wagholi, Pune", contact: "+91 98765 43210", severity: "high", status: "accepted", title: "Sudden high fever & respiratory distress", time: "35 min ago", assignedVet: "Dr. Kavita Rao" }
        ];
        _set('psk_shared_emergencies', defaultEmergencies);
      }
    }
  };
})();
</script>

function makeLucide(name) {
  const pascalName = name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
  return function LucideIcon({ size = 24, color = 'currentColor', strokeWidth = 2, style, className, ...rest }) {
    const iconData = window.lucide && window.lucide[pascalName];
    if (!iconData) return null;
    const el = window.lucide.createElement(iconData);
    const attrs = {};
    for (const a of el.attributes) attrs[a.name] = a.value;
    if (style) attrs.style = style;
    if (className) attrs.className = className;
    attrs.width = size; attrs.height = size;
    attrs.stroke = color;
    attrs.strokeWidth = strokeWidth;
    return React.createElement('svg', { ...attrs, ...rest },
      ...Array.from(el.children).map((c, i) => {
        const ca = {}; for (const a of c.attributes) ca[a.name] = a.value;
        return React.createElement(c.tagName, { key: i, ...ca });
      })
    );
  };
}

function tt(lang, key, fallback) {
  const code = LANG_CODE_MAP[lang] || lang || "en";
  if (translations[code] && translations[code][key] !== undefined && translations[code][key] !== "") {
    return translations[code][key];
  }
  if (translations.en && translations.en[key] !== undefined && translations.en[key] !== "") {
    return translations.en[key];
  }
  return fallback !== undefined ? fallback : key;
}

function mapBackendReport(r) {
  let symptomsText = "Visual inspection only.";
  try {
    if (r.reportedSymptoms) {
      let arr = typeof r.reportedSymptoms === 'string' ? JSON.parse(r.reportedSymptoms) : r.reportedSymptoms;
      if (Array.isArray(arr) && arr.length > 0) symptomsText = arr.join(', ');
    }
  } catch(e) {}
  
  return {
    id: r.id,
    type: r.screeningType === 'image_detection' ? 'detection' : 'screening',
    animalId: r.animalId || 'a1',
    animal: (r.animal && r.animal.name) || 'Livestock',
    animalName: (r.animal && r.animal.name) || 'Livestock',
    farmer: (r.farmer && r.farmer.name) || 'Farmer',
    farmerName: (r.farmer && r.farmer.name) || 'Farmer',
    datetime: r.createdAt ? new Date(r.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now',
    condition: r.aiPredictedCondition || 'Suspected condition',
    severity: (r.riskLevel || 'attention').toLowerCase(),
    confidence: r.confidenceScore || 85,
    status: r.status === 'Under_Review' ? 'Under Review' : (r.status || 'New'),
    imageUrl: r.imageUrl || null,
    farmerNotes: r.notes || null,
    voiceTranscript: r.voiceTranscript || null,
    symptoms: symptomsText,
    details: {
      title: r.aiPredictedCondition,
      level: (r.riskLevel || 'attention').toLowerCase(),
      confidence: r.confidenceScore || 85,
      photo: r.imageUrl
    }
  };
}

function mapBackendEmergency(e) {
  return {
    id: e.id,
    animalId: (e.animal && e.animal.id) || e.animalId || 'a1',
    animal: (e.animal && e.animal.name) || 'Livestock',
    farmer: (e.animal && e.animal.owner && e.animal.owner.name) || 'Farmer',
    location: e.location || 'Maharashtra',
    symptoms: e.description || e.title || 'Emergency reported',
    aiResult: e.title || 'Acute Livestock Distress',
    severity: (e.severity || 'HIGH').toLowerCase(),
    timeReported: e.createdAt ? new Date(e.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now',
    assignedVet: e.assignedVet ? e.assignedVet.name : 'Unassigned',
    status: (e.status || 'NEW').toLowerCase(),
    timer: '09:00'
  };
}

function isToday(dateInput) {
  if (!dateInput) return false;
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const currentDate = now.getDate();

  if (typeof dateInput === "string") {
    const s = dateInput.trim().toLowerCase();
    if (s === "today") return true;
    const dmyMatch = s.match(/^(\d{1,2})\s+([a-z]{3,9})\s+(\d{4})$/i);
    if (dmyMatch) {
      const day = parseInt(dmyMatch[1], 10);
      const monthStr = dmyMatch[2].slice(0, 3).toLowerCase();
      const year = parseInt(dmyMatch[3], 10);
      const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
      const monthIndex = months.indexOf(monthStr);
      if (monthIndex !== -1) {
        return year === currentYear && monthIndex === currentMonth && day === currentDate;
      }
    }
  }
  return false;
}

}

      if (selectedDistrict !== "all" && h.district !== selectedDistrict) return false;

          h.district.toLowerCase().includes(q) ||
          h.location.toLowerCase().includes(q) ||
          h.species.toLowerCase().includes(q);
        if (!match) return false;
      }
      return true;
    }).sort((a, b) => {
      const riskWeight = { High: 3, Medium: 2, Low: 1 };
      if (sortCriteria === "risk-desc") return (riskWeight[b.risk] || 0) - (riskWeight[a.risk] || 0);
      if (sortCriteria === "risk-asc") return (riskWeight[a.risk] || 0) - (riskWeight[b.risk] || 0);
      if (sortCriteria === "cases-desc") return (b.affectedAnimals || 0) - (a.affectedAnimals || 0);
      if (sortCriteria === "cases-asc") return (a.affectedAnimals || 0) - (b.affectedAnimals || 0);
      if (sortCriteria === "date-desc") return (a.daysAgo || 0) - (b.daysAgo || 0);
      if (sortCriteria === "name-asc") return (a.district || "").localeCompare(b.district || "");
      return (riskWeight[b.risk] || 0) - (riskWeight[a.risk] || 0);
    });
  }, [selectedDisease, selectedDistrict, selectedRisk, dateRange, searchQuery, sortCriteria, filterActiveHotspots, filterHighRiskOnly]);

  // Selected Hotspot Object
  const selectedHotspot = useMemo(() => {

      filteredHotspots.find((h) => h.id === selectedHotspotId) ||

      INITIAL_HOTSPOTS[0]

  }, [filteredHotspots, selectedHotspotId]);

  // Load system map configuration on mount
  useEffect(() => {
    if (window.PashuSakhiApi && window.PashuSakhiApi.getSystemConfig) {
      window.PashuSakhiApi.getSystemConfig().then(res => {
        if (res && res.success && res.data?.mapsApiKey) {

          localStorage.setItem("psk_google_maps_key", res.data.mapsApiKey);
        }
      }).catch(() => {});
    }
  }, []);

  const loadGoogleMapsScript = (apiKey) => {
    if (window.google && window.google.maps && window.google.maps.visualization) {
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const existing = document.getElementById("google-maps-api-script");
      if (existing) {
        if (window.google && window.google.maps) {
          resolve();
        } else {
          existing.addEventListener("load", resolve);
          existing.addEventListener("error", reject);
        }
        return;
      }
      const script = document.createElement("script");
      script.id = "google-maps-api-script";
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey || ""}&libraries=visualization`;
      script.async = true;
      script.defer = true;
      script.onload = () => resolve();
      script.onerror = (e) => reject(e);
      document.head.appendChild(script);
    });
  };

  // Google Maps Hybrid/Satellite Initialization & Update
  useEffect(() => {
    if (mapEngine !== "google") return;
    if (!googleMapRef.current) return;

    loadGoogleMapsScript(googleApiKey).then(() => {
      if (!window.google || !window.google.maps) return;

      if (!googleMapInstanceRef.current) {

      // Clear existing markers

      // Google Heatmap Layer
      if (googleHeatmapRef.current) {

      if (showRiskZones && window.google.maps.visualization) {
        const heatPoints = [];

          heatPoints.push({
            location: new google.maps.LatLng(h.lat || 19.0, h.lng || 75.0),

        const heatmap = new google.maps.visualization.HeatmapLayer({

          map: gmap
        });

      }

      // Add Vet Markers
      if (showVetMarkers) {

            title: v.name,
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 6,
              fillColor: '#1F5D50',
              fillOpacity: 1,
              strokeColor: '#fff',
              strokeWeight: 1.5
            }
          });
          googleMarkersRef.current.push(marker);
        });
      }

      // Add Hotspot markers with InfoWindow
      filteredHotspots.forEach(h => {
        const isSelected = selectedHotspotId === h.id;
        const pinColor = h.risk === "High" ? "#B3402A" : h.risk === "Medium" ? "#D98B2B" : "#2F7A4F";
        const marker = new google.maps.Marker({
          position: { lat: h.lat || 19.0, lng: h.lng || 75.0 },
          map: gmap,
          title: `${h.disease} (${h.affectedAnimals} cases)`,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: isSelected ? 11 : 7,
            fillColor: pinColor,
            fillOpacity: 0.9,
            strokeColor: isSelected ? "#ffffff" : pinColor,
            strokeWeight: isSelected ? 3 : 1.5

        const info = new google.maps.InfoWindow({

            <strong style="font-size:13px;display:block;margin-bottom:2px;">${h.disease}</strong>

        });

    // Clear old layers
    if (heatLayerRef.current) map.removeLayer(heatLayerRef.current);
    if (markerLayerRef.current) map.removeLayer(markerLayerRef.current);

    const newMarkerLayer = L.layerGroup().addTo(map);

    const heatData = [];

    // Add Vet Markers
    if (showVetMarkers) {

    // Add Hotspot Markers and Heatmap Data

        // Spread radius roughly 0.05 to 0.15 degrees
        const spread = (h.radius || 40) / 400; 
        
        // Push the epicenter
        heatData.push([h.lat || 19.0, h.lng || 75.0, 1.0]);
        
        for (let i = 0; i < pointCount; i++) {
          // Generate normally-distributed random offset
          const r = spread * Math.sqrt(Math.random());
          const theta = Math.random() * 2 * Math.PI;
          const latOffset = r * Math.cos(theta);
          const lngOffset = r * Math.sin(theta);
          // Intensity decays slightly from center
          const intensity = 0.4 + (Math.random() * 0.4);
          heatData.push([(h.lat || 19.0) + latOffset, (h.lng || 75.0) + lngOffset, intensity]);
        }
      }

      const isSelected = selectedHotspotId === h.id;
      const isHigh = h.risk === "High";
      const pinColor = isHigh ? "#B3402A" : h.risk === "Medium" ? "#D98B2B" : "#2F7A4F";

    });

    if (showRiskZones && heatData.length > 0) {
      heatLayerRef.current = L.heatLayer(heatData, {
        radius: 35, blur: 20, maxZoom: 10,

      }).addTo(map);

  }, [mapEngine, filteredHotspots, selectedHotspotId, showRiskZones, showVetMarkers]);

  // Priority response ranking: computed dynamically
  const rankedAreas = useMemo(() => {
    return [...filteredHotspots].sort((a, b) => {
      const weightRisk = { High: 100, Medium: 50, Low: 20 };
      const scoreA =
        (weightRisk[a.risk] || 0) +
        a.affectedAnimals * 1.5 +
        a.affectedFarms * 3 +
        parseInt(a.recentIncrease.replace(/[^0-9-]/g, "") || "0", 10) * 2 -
        a.daysAgo * 5;
      const scoreB =
        (weightRisk[b.risk] || 0) +
        b.affectedAnimals * 1.5 +
        b.affectedFarms * 3 +
        parseInt(b.recentIncrease.replace(/[^0-9-]/g, "") || "0", 10) * 2 -
        b.daysAgo * 5;
      return scoreB - scoreA;
    });
  }, [filteredHotspots]);

  // Dynamic statistics based on filtered hotspots
  const stats = useMemo(() => {
    const totalCases = filteredHotspots.reduce((acc, h) => acc + h.affectedAnimals, 0);
    const totalFarms = filteredHotspots.reduce((acc, h) => acc + h.affectedFarms, 0);
    const confirmedCount = filteredHotspots.filter((h) => h.status === "Confirmed").reduce((acc, h) => acc + h.affectedAnimals, 0);
    const suspectedCount = filteredHotspots.filter((h) => h.status === "Suspected").reduce((acc, h) => acc + h.affectedAnimals, 0);
    const highRiskZones = filteredHotspots.filter((h) => h.risk === "High").length;
    const mediumRiskZones = filteredHotspots.filter((h) => h.risk === "Medium").length;
    const lowRiskZones = filteredHotspots.filter((h) => h.risk === "Low").length;

    const newCasesPeriod = Math.round(totalCases * (trendWindow === "7d" ? 0.38 : 0.82));
    const growthPercent = highRiskZones > 1 ? "+21.4%" : "+8.7%";

    return {
      totalCases,
      totalFarms,
      confirmedCount,
      suspectedCount,
      highRiskZones,
      mediumRiskZones,
      lowRiskZones,
      newCasesPeriod,
      growthPercent,
      activeHotspotsCount: filteredHotspots.length
    };
  }, [filteredHotspots, trendWindow]);

  // Outbreak alerts (derived from filtered hotspots with urgency)
  const alertsList = useMemo(() => {
    return filteredHotspots.map((h) => ({
      ...h,
      urgency: h.risk === "High" ? "Critical Immediate Action" : h.risk === "Medium" ? "Containment Advisory" : "Precautionary Monitoring",
    }));
  }, [filteredHotspots]);

  // Support providers sorted by proximity to selected hotspot

      const sum = filteredHotspots.reduce((acc, h) => acc + (h.dailyHistory ? (h.dailyHistory[idx] || 0) : 0), 0);
      return sum > 0 ? sum : Math.round(stats.totalCases * [0.15, 0.22, 0.35, 0.5, 0.65, 0.85, 1.0][idx]);
    });

    const maxVal = Math.max(...rawTotal, 15);
    const maxY = Math.ceil(maxVal / 20) * 20 || 40;
    const ySteps = [maxY, Math.round(maxY * 0.66), Math.round(maxY * 0.33), 0];

    const count = labels.length;
    const getX = (i) => 50 + (i / (count - 1)) * (710 - 50);
    const getY = (val) => 180 - (val / maxY) * 145;

    const pts = rawTotal.map((v, i) => ({
      x: Math.round(getX(i)),
      y: Math.round(Math.min(180, Math.max(30, getY(v)))),
      val: v
    }));

    const makeLine = (pts) => {
      if (pts.length === 0) return "";
      return pts.reduce((acc, pt, i, arr) => {
        if (i === 0) return `M ${pt.x},${pt.y}`;
        const prev = arr[i - 1];
        const cp1x = Math.round(prev.x + (pt.x - prev.x) / 2);
        return `${acc} C ${cp1x},${prev.y} ${cp1x},${pt.y} ${pt.x},${pt.y}`;
      }, "");
    };

    const lineD = makeLine(pts);
    const areaD = pts.length > 0
      ? `${lineD} L ${pts[pts.length - 1].x},180 L ${pts[0].x},180 Z`
      : "";

    return {
      labels,
      pts,
      lineD,
      areaD,
      ySteps,
      maxY

function ConsultationChatModal({ request, messages, onClose, onSendMessage, onEndChat }) {
  const [inputText, setInputText] = useState("");

  useEffect(() => {
    if (messagesEndRef.current) {
      messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  }, [messages]);

  const handleSend = () => {
    if (!inputText.trim()) return;
    onSendMessage(request.animalId || request.id, inputText.trim());
    setInputText("");
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  if (!request) return null;

  return (
    <div className="modal-backdrop" onClick={onClose}>

              <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>

  const [sampleRequests, setSampleRequests] = useState(() => {

          id: "SMP-1042",
          animalId: "gauri",
          animalName: "Gauri (Cow)",
          farmerName: "Ramesh Yadav",
          location: "Sawantwadi, Nashik",

          instructions: "Collect 15ml mid-stream quarter milk sample aseptically; transport in sterile cold vial at 4°C.",
          notes: "Farmer noticed warm quarter and drop in yield.",
          assignedParaVet: "Sunita Gaikwad",
          assignedParaVetId: "pv-101",
          status: "Assigned",
          requestedAt: "Today, 08:30 AM"
        }
      ];
    } catch(e) {
      return [];
    }
  });

  const getRequestMessages = (req) => {
    if (!req) return [];
    const animalId = req.animalId || req.id;
    if (chatMessages[animalId] && chatMessages[animalId].length > 0) {
      return chatMessages[animalId];
    }
    const bridgeChats = window.PashuSakhiBridge ? window.PashuSakhiBridge.getChats(animalId) : [];
    if (bridgeChats && bridgeChats.length > 0) {
      return bridgeChats;
    }
    return [
      {
        id: "msg_init_" + req.id,
        sender: "farmer",
        text: `Namaste Dr. Aditi. My ${req.species || 'animal'} ${req.animal} is showing signs: ${req.symptoms}. Please advise on what treatment or medicine to administer.`,
        time: req.submitted || "Just now",
        timestamp: Date.now() - 600000
      }
    ];
  };

  const handleSendChatMessage = (animalId, text) => {
    if (!text || !text.trim()) return;
    const cleanText = text.trim();
    const newMsg = {
      id: "msg_" + Date.now(),
      sender: "vet",
      text: cleanText,
      time: "Just now",
      timestamp: Date.now(),
      animalId: animalId
    };

    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.sendChat(animalId, newMsg);
    }

    setChatMessages(prev => {
      const current = prev[animalId] || (window.PashuSakhiBridge ? window.PashuSakhiBridge.getChats(animalId) : []) || [];
      return {
        ...prev,
        [animalId]: [...current, newMsg]
      };
    });

    setRequests(prev => prev.map(req => (req.animalId === animalId || req.id === animalId) ? { ...req, status: "inConsultation" } : req));
  };

  const getEmergencyMessages = (emg) => {
    if (!emg) return [];
    const animalId = emg.animalId || emg.id;
    if (chatMessages[animalId] && chatMessages[animalId].length > 0) {
      return chatMessages[animalId];
    }
    const bridgeChats = window.PashuSakhiBridge ? window.PashuSakhiBridge.getChats(animalId) : [];
    if (bridgeChats && bridgeChats.length > 0) {
      return bridgeChats;
    }
    return [
      {
        id: "emg_init_" + emg.id,
        sender: "farmer",
        text: `ðŸš¨ URGENT EMERGENCY: ${emg.animal} has severe acute distress! Symptoms: ${emg.symptoms}. Location: ${emg.location}. Please provide immediate veterinary advice!`,
        time: emg.timeReported || "Just now",
        timestamp: Date.now() - 300000
      }
    ];
  };

  const handleSendEmergencyMessage = (animalId, text) => {
    if (!text || !text.trim()) return;
    const cleanText = text.trim();
    const newMsg = {
      id: "emg_msg_" + Date.now(),
      sender: "vet",
      text: cleanText,
      time: "Just now",
      timestamp: Date.now(),
      animalId: animalId,
      isEmergency: true
    };

    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.sendChat(animalId, newMsg);
    }

    setChatMessages(prev => {
      const current = prev[animalId] || (window.PashuSakhiBridge ? window.PashuSakhiBridge.getChats(animalId) : []) || [];
      return {
        ...prev,
        [animalId]: [...current, newMsg]
      };
    });

    showToast("Urgent instruction dispatched to farmer.");
  };

  const handleSendTreatment = (treatmentData) => {
    if (!treatmentModalPatient) return;
    if (!treatmentData.condition || !treatmentData.condition.trim()) {
      showToast("Please enter diagnosis/condition.");
      return;
    }
    if (!treatmentData.medicine || !treatmentData.medicine.trim()) {
      showToast("Please enter prescribed medicine.");
      return;
    }
    const animalId = treatmentModalPatient.id;
    const entry = {
      id: "trt_" + Date.now(),
      date: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
      condition: treatmentData.condition.trim(),
      medicine: treatmentData.medicine.trim(),
      dosage: treatmentData.dosage ? treatmentData.dosage.trim() : "Standard dose",
      route: treatmentData.route || "Oral",
      duration: treatmentData.duration || "3 days",
      notes: treatmentData.notes ? treatmentData.notes.trim() : "Prescribed by Dr. Aditi Kulkarni",
      followUp: treatmentData.followUp ? treatmentData.followUp.trim() : "—",
      vetName: profile.name,
      attachments: 0
    };

    if (window.PashuSakhiApi) {
      window.PashuSakhiApi.createTreatment(animalId, {
        diagnosis: entry.condition,
        medication: entry.medicine,
        dosage: entry.dosage,
        instructions: entry.notes
      }).catch(e => console.warn('Backend createTreatment error:', e));
    }

    if (window.PashuSakhiBridge) {
      window.PashuSakhiBridge.addTreatment(animalId, entry);
      window.PashuSakhiBridge.sendChat(animalId, {
        sender: "vet",
        text: `Prescribed Treatment for ${treatmentModalPatient.name}:\n- Condition: ${entry.condition}\n- Medicine: ${entry.medicine}\n- Dosage & Route: ${entry.dosage} (${entry.route})\n- Duration: ${entry.duration}\n- Instructions: ${entry.notes}${entry.followUp !== '—' ? '\n- Follow-up: ' + entry.followUp : ''}`,
        time: "Just now"
      });
    }

    setTreatmentHistory(prev => ({
      ...prev,
      [animalId]: [entry, ...(prev[animalId] || [])]
    }));

    showToast("Treatment sent to farmer successfully.");
    setTreatmentModalPatient(null);
  };

  const handleSendSampleRequest = (sampleData) => {
    if (!sampleModalPatient) return;
    const pv = PARA_VET_USERS.find(u => u.id === sampleData.paraVetId) || PARA_VET_USERS[0];
    const newReq = {
      id: "SMP-" + Math.floor(1000 + Math.random() * 9000),
      animalId: sampleModalPatient.id,
      animalName: `${sampleModalPatient.name} (${sampleModalPatient.species})`,
      farmerName: sampleModalPatient.owner,
      location: sampleModalPatient.location,
      sampleType: sampleData.sampleType || "Blood (Serum / EDTA)",
      reason: sampleData.reason ? sampleData.reason.trim() : "Diagnostic Confirmation",
      priority: sampleData.priority || "High",
      instructions: sampleData.instructions ? sampleData.instructions.trim() : "Collect sample under sterile precautions and maintain cold chain.",
      notes: sampleData.notes ? sampleData.notes.trim() : "",
      assignedParaVet: pv.name,
      assignedParaVetId: pv.id,
      assignedParaVetPhone: pv.phone,
      status: "Assigned",
      requestedAt: "Just now"
    };

    const nextList = [newReq, ...sampleRequests];
    setSampleRequests(nextList);
    try {
      localStorage.setItem('psk_sample_requests', JSON.stringify(nextList));

    }

    // Load and merge persisted bridge reports
    const bridgeReports = window.PashuSakhiBridge.getReports();

      setReports((prev) => {
        const existingIds = new Set(prev.map((r) => r.id));
        const toAdd = bridgeReports.filter((r) => !existingIds.has(r.id));
        return [...toAdd, ...prev];
      });
    }

    // Load and merge persisted bridge emergencies
    const bridgeEmergencies = window.PashuSakhiBridge.getEmergencies();
    if (bridgeEmergencies && bridgeEmergencies.length > 0) {
      setEmergencies((prev) => {
        const existingIds = new Set(prev.map((e) => e.id));
        const toAdd = bridgeEmergencies.filter((e) => !existingIds.has(e.id));
        return [...toAdd, ...prev];
      });
    }


    // Load live backend screening reports
    if (window.PashuSakhiApi && window.PashuSakhiApi.getScreeningReports) {
      window.PashuSakhiApi.getScreeningReports()
        .then(res => {
          if (res && res.success && Array.isArray(res.data)) {
            const mapped = res.data.map(mapBackendReport);
            setReports(prev => {
              const ids = new Set(prev.map(p => p.id));
              const fresh = mapped.filter(m => !ids.has(m.id));
              return [...fresh, ...prev];

        })

    }

            const mapped = res.data.map(mapBackendEmergency);
            setEmergencies(prev => {
              const ids = new Set(prev.map(p => p.id));
              const fresh = mapped.filter(m => !ids.has(m.id));
              return [...fresh, ...prev];
            });
          }
        })
        .catch(err => console.warn('Backend getEmergencies fallback:', err));

    const handleBridgeEvent = (eventName, data) => {
      if (eventName === "psk:report:added" && data) {
        setReports((prev) => {
          if (prev.some((r) => r.id === data.id)) return prev;
          return [data, ...prev];
        });
        showToast(`New AI Report submitted for ${data.animalName || 'livestock'}.`);
      } else if (eventName === "psk:emergency:added" && data) {
        setEmergencies((prev) => {
          if (prev.some((e) => e.id === data.id)) return prev;
          return [data, ...prev];
        });
        showToast(`🚨 Emergency Alert: ${data.title || data.animalName}!`);
      } else if (eventName === "psk:chat:message" && data && data.message) {
        if (data.message.sender === "farmer") {
          setRequests((prev) => {
            const reqIdx = prev.findIndex((r) => r.animalId === data.animalId);
            if (reqIdx >= 0) {
              const updated = [...prev];
              updated[reqIdx] = {
                ...updated[reqIdx],
                symptoms: data.message.text,
                submitted: "Just now",
                status: "new"
              };
              return updated;

        ) : view === "settings" ? (
          <div className="workspace-page">
            <div className="page-head"><div><h2>{t("auto_settings", "Settings")}</h2><p>{t("auto_manage_veterina", "Manage veterinarian account, accessibility, notifications and privacy preferences.")}</p></div><button className="btn-primary btn-sm" onClick={()=>showToast("Settings saved successfully.")}><Save size={14}/> Save changes</button></div>
            <div className="settings-grid">
              <Card><SectionTitle>Account</SectionTitle>
                <div className="setting-row"><div><strong>{t("auto_veterinarian", "Veterinarian")}</strong><span>{profile.name} · {profile.qualification}</span></div><button className="btn-outline btn-sm" onClick={()=>showToast("Profile editor opened.")}>Manage Profile</button></div>
                <div className="setting-row"><div><strong>{t("auto_availability", "Availability")}</strong><span>{t("auto_controls_whethe", "Controls whether new consultations can be assigned.")}</span></div><select value={availability} onChange={e=>setAvailability(e.target.value)}><option value="available">Available</option><option value="busy">Busy</option><option value="emergencyOnly">Emergency Only</option><option value="offline">Offline</option><option value="leave">On Leave</option></select></div>
              </Card>
              <Card><SectionTitle>Language & Accessibility</SectionTitle>
                <div className="setting-row"><div><strong>{t("auto_app_language", "App Language")}</strong><span>Current: {appLanguage}</span></div><select value={appLanguage} onChange={e=>{setAppLanguage(e.target.value);showToast(`Language updated.`)}}><option value="en">English</option><option value="hi">Hindi</option><option value="mr">Marathi</option><option value="gu">Gujarati</option><option value="pa">Punjabi</option></select></div>
                <div className="setting-row"><div><strong>{t("auto_text_size", "Text Size")}</strong><span>{t("auto_adjust_the_dash", "Adjust the dashboard reading size.")}</span></div><select value={textSize} onChange={e=>setTextSize(e.target.value)}><option>Small</option><option>Medium</option><option>Large</option></select></div>
                <div className="setting-row"><div><strong>{t("auto_theme", "Theme")}</strong><span>{t("auto_switch_between_", "Switch between light, dark and system-style presentation.")}</span></div><select value={theme} onChange={e=>{setTheme(e.target.value);showToast(`Theme changed to ${e.target.value}.`)}}><option>Light</option><option>Dark</option><option>System</option></select></div>
                <div className="setting-row"><div><strong>{t("auto_high_contrast_m", "High Contrast Mode")}</strong><span>{t("auto_increase_border", "Increase border and text contrast.")}</span></div><button className={`toggle ${highContrast?"on":""}`} onClick={()=>setHighContrast(v=>!v)}>{highContrast?"ON":"OFF"}</button></div>
              </Card>
              <Card><SectionTitle>Notifications</SectionTitle>
                <div className="setting-row"><div><strong>{t("auto_notification_pr", "Notification Preferences")}</strong><span>{t("auto_emergency__cons", "Emergency, consultation and system alerts.")}</span></div><button className={`toggle ${notificationPreferences?"on":""}`} onClick={()=>setNotificationPreferences(v=>!v)}>{notificationPreferences?"ON":"OFF"}</button></div>
                <div className="setting-row"><div><strong>{t("auto_reminder_timing", "Reminder Timing")}</strong><span>{t("auto_when_follow_up_", "When follow-up reminders should appear.")}</span></div><select value={reminderTiming} onChange={e=>setReminderTiming(e.target.value)}><option>At scheduled time</option><option>15 minutes before</option><option>30 minutes before</option><option>1 hour before</option></select></div>
              </Card>
              <Card><SectionTitle>Privacy & Support</SectionTitle>
                <div className="setting-row"><div><strong>{t("auto_app_permissions", "App Permissions")}</strong><span>{t("auto_camera__notific", "Camera, notifications and location permissions.")}</span></div><button className="btn-outline btn-sm" onClick={()=>showToast("App permissions panel opened.")}>Manage</button></div>
                <div className="setting-row"><div><strong>{t("auto_help___support", "Help & Support")}</strong><span>{t("auto_faqs__help_cent", "FAQs, Help Center and report a problem.")}</span></div><button className="btn-outline btn-sm" onClick={()=>showToast("Support options opened.")}>Open Support</button></div>
                <div className="setting-row"><div><strong>{t("auto_about_pashu_sak", "About Pashu Sakhi")}</strong><span>{t("auto_veterinarian_wo", "Veterinarian workspace · prototype build")}</span></div><button className="btn-outline btn-sm" onClick={()=>showToast("Pashu Sakhi veterinarian workspace.")}>About</button></div>
              </Card>
            </div>
          </div>
        ) : view === "requests" ? (
          <div className="workspace-page">
            <div className="page-head"><div><h2>{t("auto_chat_requests", "Chat Requests")}</h2><p>{t("auto_consultation_re", "Consultation requests from farmers, with status, priority, and direct reply advice.")}</p></div></div>
            <Card>
              {requests.map(r => (
                <div className="record-row" key={r.id} style={{ flexDirection: "column", alignItems: "stretch", gap: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <Avatar label={r.animal} size={44} tone={r.priority === "critical" ? "urgent" : "attention"} />
                      <div className="record-main">
                        <div className="record-title">{r.animal} <span>· {r.farmer}</span></div>
                        <div className="record-sub">{r.symptoms}</div>
                        <div className="record-badges">
                          <SeverityBadge level={r.priority} />
                          <StatusPill status={r.status} />
                          <span className="record-sub">{r.submitted}</span>
                        </div>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <button
                        type="button"
                        className="btn-primary btn-sm"
                        onClick={() => setActiveChatRequest(r)}
                        style={{ display: "inline-flex", alignItems: "center", gap: 5, fontWeight: 700 }}
                        title="Open dedicated consultation chat window"
                      >
                        <MessageCircle size={14} />
                        Open Chat
                      </button>
                      <button
                        type="button"
                        className="btn-outline btn-sm"
                        onClick={() => setReviewModalRequest(r)}
                        style={{ display: "inline-flex", alignItems: "center", gap: 5, fontWeight: 700 }}
                        title="Review case details and triage"
                      >
                        <Eye size={14} />
                        {t("auto_review_chat_req", "Review Details")}
                      </button>
                      {r.status !== "resolved" ? (
                        <button
                          type="button"
                          className="btn-outline btn-sm"
                          onClick={() => handleEndChatWithFarmer(r)}
                          style={{ display: "inline-flex", alignItems: "center", gap: 5, color: "var(--urgent)", borderColor: "rgba(179,64,42,0.35)", fontWeight: 700 }}
                          title="Conclude active farmer consultation"
                        >
                          <XCircle size={14} />
                          {t("auto_end_chat_farmer", "End Chat")}
                        </button>
                      ) : (
                        <span className="badge badge-healthy" style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "5px 10px", fontSize: 12 }}>
                          <CheckCircle2 size={13} /> {t("auto_chat_concluded", "Consultation Concluded")}
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                    <input
                      type="text"
                      id={`reply_input_${r.id}`}
                      placeholder="Type veterinary advice or reply to farmer..."
                      style={{
                        flex: 1, padding: "8px 12px", borderRadius: 8, border: "1px solid var(--line)",
                        background: "var(--paper)", color: "var(--ink)", fontSize: 13
                      }}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") {
                          const val = e.target.value.trim();
                          if (val) {
                            const animalId = r.animalId || "a1";
                            if (window.PashuSakhiBridge) {
                              window.PashuSakhiBridge.sendChat(animalId, {
                                sender: "vet",
                                text: val,
                                time: "Just now"
                              });
                            }
                            showToast(`Reply dispatched to ${r.farmer || "farmer"}.`);
                            e.target.value = "";
                            setRequests(prev => prev.map(item => item.id === r.id ? { ...item, status: "replied" } : item));
                          }
                        }
                      }}
                    />
                    <button
                      className="btn-primary btn-sm"
                      style={{ display: "inline-flex", alignItems: "center", gap: 4 }}
                      onClick={() => {
                        const el = document.getElementById(`reply_input_${r.id}`);
                        const val = el ? el.value.trim() : "";
                        if (val) {
                          const animalId = r.animalId || "a1";
                          if (window.PashuSakhiBridge) {
                            window.PashuSakhiBridge.sendChat(animalId, {
                              sender: "vet",
                              text: val,
                              time: "Just now"
                            });
                          }
                          showToast(`Reply dispatched to ${r.farmer || "farmer"}.`);
                          el.value = "";
                          setRequests(prev => prev.map(item => item.id === r.id ? { ...item, status: "replied" } : item));
                        } else {
                          showToast("Please enter advice or a reply message first.");
                        }
                      }}
                    >
                      <Send size={14} /> Send Reply
                    </button>
                  </div>
                </div>
              ))}
            </Card>
          </div>
        ) : (
          <>
            {/* Standard Overview Content */}
            <div className="summary-banner">
              <div className="icon-wrap"><ClipboardList size={24} /></div>
              <div>
                <p>{emergencyCount} emergency cases and {unreadRequestsCount} new requests need your attention.</p>
                <div className="sub">{t("overview_workloadUpdated", "Workload updated a few minutes ago")}</div>
              </div>
            </div>

            <div className="stat-grid">
              <div className="stat-card" onClick={() => setView("requests")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--brand-soft)", color: "var(--brand-dark-contrast)" }}><MessageCircle size={16} /></div></div>
                <p className="stat-value">{unreadRequestsCount}</p>
                <p className="stat-label">{t("auto_unread_requests", "Unread Requests")}</p>
              </div>
              <div className="stat-card" onClick={() => setView("patients")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--healthy-soft)", color: "var(--healthy)" }}><CalendarClock size={16} /></div></div>
                <p className="stat-value">{followUpsToday}</p>
                <p className="stat-label">{t("auto_follow_ups_toda", "Follow-ups Today")}</p>
              </div>
              <div className="stat-card" onClick={() => setView("emergency")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--urgent-soft)", color: "var(--urgent)" }}><Siren size={16} /></div></div>
                <p className="stat-value">{emergencyCount}</p>
                <p className="stat-label">{t("auto_emergency_cases", "Emergency Cases")}</p>
              </div>
              <div className="stat-card" onClick={() => setView("requests")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--attention-soft)", color: "var(--attention)" }}><Activity size={16} /></div></div>
                <p className="stat-value">{requests.filter((r) => r.status !== "resolved").length}</p>
                <p className="stat-label">{t("auto_active_cases", "Active Cases")}</p>
              </div>
              <div className="stat-card" onClick={() => setView("heatmap")}>
                <div className="stat-card-top"><div className="stat-icon" style={{ background: "var(--urgent-soft)", color: "var(--urgent)" }}><Flame size={16} /></div></div>
                <p className="stat-value">{INITIAL_HOTSPOTS.length}</p>
                <p className="stat-label">{t("auto_disease_hotspot", "Disease Hotspots")}</p>
              </div>
            </div>

            <Card style={{ marginBottom: 20, background: "linear-gradient(135deg, #143F36 0%, #1F5D50 100%)", color: "#fff" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14 }}>
                <div>
                  <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 800, background: "rgba(255,255,255,0.15)", padding: "3px 9px", borderRadius: 999, marginBottom: 6 }}>
                    <Flame size={12} color="#D98B2B" />
                    REGIONAL EPIDEMIOLOGY ALERT
                  </div>
                  <h3 style={{ margin: "0 0 4px", fontSize: 18, fontFamily: "Fraunces, serif" }}>{t("auto_active_hotspots", "Active Hotspots Detected in Nashik & Pune Districts")}</h3>
                  <p style={{ margin: 0, fontSize: 13.5, opacity: 0.9 }}>{t("auto_lumpy_skin_dise", "Lumpy Skin Disease (LSD) and FMD containment rings currently active. View geographical risk mapping and mobile units.")}</p>
                </div>
                <button className="btn-primary" style={{ background: "var(--accent)", color: "#2A1B04" }} onClick={() => setView("heatmap")}><MapPinned size={16}/> Open Heat Map Dashboard</button>
              </div>
            </Card>

            <SectionTitle>Priority Cases</SectionTitle>
            <Card style={{ padding: "4px 18px", marginBottom: 22 }}>
              {requests.slice(0, 4).map((r) => (
                <div key={r.id} className="list-row">
                  <Avatar label={r.animal} size={44} tone={r.priority === "critical" ? "urgent" : "attention" } />
                  <div className="list-row-info">
                    <p className="list-row-title">{r.animal} <span style={{ fontWeight: 500, color: "var(--ink-soft)" }}>· {r.farmer}</span></p>
                    <p className="list-row-symptoms">{r.symptoms}</p>
                    <div className="list-row-badges"><SeverityBadge level={r.priority} /><StatusPill status={r.status} /><span className="list-row-meta" style={{ margin: 0 }}>{r.submitted}</span></div>
                  </div>
                  <button
  className="btn-primary btn-sm"
  onClick={() => {
    const match = patients.find(p => p.id === r.animalId || p.name.toLowerCase() === r.animal.toLowerCase()) || patients[0];
    setSelectedPatientId(match.id);
    setView("patients");
    showToast(`Opened patient record for ${match.name}.`);
  }}
>
  Open Case
</button>
                </div>
              ))}
            </Card>
          </>
        )}
      </main>

      

      {/* Toast Feedback */}
      {/* Review Chat Request Modal */}
      {reviewModalRequest && (
        <div className="modal-backdrop" onClick={() => setReviewModalRequest(null)}>
          <div className="modal-card" style={{ maxWidth: 540 }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, borderBottom: "1.5px solid var(--line)", paddingBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Avatar label={reviewModalRequest.animal} size={42} tone={reviewModalRequest.priority === "critical" ? "urgent" : "attention"} />
                <div>
                  <h3 style={{ margin: 0, fontSize: 17, fontFamily: "Fraunces, serif", color: "var(--ink)" }}>Review Consultation Request</h3>
                  <p style={{ margin: 0, fontSize: 12, color: "var(--ink-soft)" }}>Case #{reviewModalRequest.id} · Received {reviewModalRequest.submitted}</p>
                </div>
              </div>
              <button className="btn-icon" onClick={() => setReviewModalRequest(null)} style={{ border: "none", background: "transparent", cursor: "pointer" }}>
                <X size={20} />
              </button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, padding: "12px 14px", background: "var(--paper-soft)", borderRadius: 10, border: "1px solid var(--line)", marginBottom: 14 }}>
              <div><span style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 700, textTransform: "uppercase" }}>Farmer</span><div style={{ fontWeight: 700, fontSize: 13.5 }}>{reviewModalRequest.farmer}</div></div>
              <div><span style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 700, textTransform: "uppercase" }}>Location / District</span><div style={{ fontWeight: 700, fontSize: 13.5 }}>{reviewModalRequest.location || reviewModalRequest.district || "Maharashtra"}</div></div>
              <div><span style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 700, textTransform: "uppercase" }}>Animal & Tag</span><div style={{ fontWeight: 700, fontSize: 13.5 }}>{reviewModalRequest.animal} ({reviewModalRequest.animalId || "TAG-A1"})</div></div>
              <div><span style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 700, textTransform: "uppercase" }}>Triage Priority</span><div><SeverityBadge level={reviewModalRequest.priority} /></div></div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", marginBottom: 4 }}>Reported Symptoms</div>
              <div style={{ padding: "10px 12px", background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 8, fontSize: 13.5, color: "var(--ink)", lineHeight: 1.4 }}>
                {reviewModalRequest.symptoms}
              </div>
            </div>

            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", marginBottom: 4 }}>Clinical Triage Note</div>
              <p style={{ margin: 0, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.4 }}>
                Farmer is awaiting veterinary consultation. Review livestock medical history, issue treatment advice, or schedule an on-field visit if emergency symptoms develop.
              </p>
            </div>

            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, borderTop: "1.5px solid var(--line)", paddingTop: 12 }}>
              <button
                type="button"
                className="btn-outline"
                onClick={() => setReviewModalRequest(null)}
              >
                Close Review
              </button>
              {reviewModalRequest.status !== "resolved" && (
                <button
                  type="button"
                  className="btn-outline"
                  onClick={() => handleEndChatWithFarmer(reviewModalRequest)}
                  style={{ color: "var(--urgent)", borderColor: "rgba(179,64,42,0.35)", fontWeight: 700 }}
                >
                  <XCircle size={15} style={{ verticalAlign: -2, marginRight: 4 }} />
                  End Chat
                </button>
              )}
              <button
                type="button"
                className="btn-primary"
                onClick={() => {
                  const reqToOpen = reviewModalRequest;
                  setReviewModalRequest(null);
                  setActiveChatRequest(reqToOpen);
                }}
              >
                <MessageCircle size={15} style={{ verticalAlign: -2, marginRight: 4 }} />
                Accept & Start Chat
              </button>
            </div>
          </div>
        </div>
      )}

            {/* Real Consultation Chat Modal */}
      {activeChatRequest && (
        <ConsultationChatModal
          request={activeChatRequest}
          messages={getRequestMessages(activeChatRequest)}
          onClose={() => setActiveChatRequest(null)}
          onSendMessage={handleSendChatMessage}
          onEndChat={handleEndChatWithFarmer}
        />
      )}

      {/* Real Emergency Chat Modal */}
      {activeEmergencyChat && (
        <EmergencyChatModal
          emergency={activeEmergencyChat}
          messages={getEmergencyMessages(activeEmergencyChat)}
          onClose={() => setActiveEmergencyChat(null)}
          onSendMessage={handleSendEmergencyMessage}
        />
      )}

      {/* Functional Notifications Modal */}
      <NotificationsModal
        notifications={notifications}
        isOpen={notificationsOpen}
        onClose={() => setNotificationsOpen(false)}
        onMarkAllRead={handleMarkAllNotificationsRead}
        onNotificationClick={handleNotificationClick}
      />

      {/* New Treatment Form Modal */}
      {treatmentModalPatient && (
        <NewTreatmentModal
          patient={treatmentModalPatient}
          onClose={() => setTreatmentModalPatient(null)}
          onSendTreatment={handleSendTreatment}
        />
      )}

      {/* Sample Collection Request Modal with Para-Vet Selection */}
      {sampleModalPatient && (
        <SampleCollectionModal
          patient={sampleModalPatient}
          paraVets={PARA_VET_USERS}
          onClose={() => setSampleModalPatient(null)}
          onSendSampleRequest={handleSendSampleRequest}
        />
      )}

      {/* Report Review Modal */}
      {reviewingReport && (
        <ReportReviewModal
          report={reviewingReport}
          onClose={() => setReviewingReport(null)}
          onConfirm={(id) => {
            updateReport(id, "Resolved");
            setReviewingReport(null);
          }}
          onEscalate={(rep) => {
            updateEmergency(rep.id, "new");
            showToast(`Report ${rep.id} escalated to Emergency Case.`);
            setReviewingReport(null);
            setView("emergency");
          }}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
      </div>
    </LanguageContext.Provider>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<VetApp />);
</script>
</body>
</html>
