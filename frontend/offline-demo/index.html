<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pashu Sakhi - Farmer Dashboard (Standalone)</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Local Vendor Scripts (Works offline and without localhost) -->
  <script src="vendor/react.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/lucide-react.js"></script>

  <!-- Fallback CDN in case vendor files are moved -->
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"><\/script>');
    }
    if (!window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>');
    }
    if (!window.LucideReact) {
      document.write('<script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Offline-safe API client -->
  <script src="pashusakhi_api.js"></script>

  <!-- PashuSakhi Shared Local Storage Bridge -->
  <script src="bridge.js"></script>

  <!-- Main Farmer Dashboard Application -->
  <script src="app.js"></script>

  <script>
    window.addEventListener("error", function (event) {
      const root = document.getElementById("root");
      if (root && root.innerHTML.trim() === "") {
        root.innerHTML = '<div style="font-family:Arial,sans-serif;padding:40px;max-width:700px;margin:auto"><h2>PashuSakhi Dashboard</h2><p style="color:#b3402a">' + (event.message || 'Error initializing application.') + '</p></div>';
      }
    });
  </script>
</body>
</html>
